{{- if .Values.secrets.managed }}
{{- $maria := eq .Values.tenant.dbType "mariadb" -}}
# Per-tenant nextcloud-secrets, assembled by ESO from two sources:
#   - shared S3 creds      <- ClusterSecretStore (kubernetes provider) -> seed Secret
#   - per-tenant passwords <- ClusterGenerator (Password), one fresh value per field
# refreshInterval "0" = generate ONCE and never refresh, so a running tenant's
# passwords are never rotated out from under it. deletionPolicy Retain keeps the
# Secret if this ExternalSecret is ever removed. Rendered only for managed tenants.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/part-of: nextcloud-platform
    nextcloud.platform/tenant: {{ .Values.tenant.name | quote }}
spec:
  refreshInterval: "0"
  target:
    name: nextcloud-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      data:
        nextcloud-username: "admin"
        nextcloud-password: "{{`{{ .adminPw }}`}}"
        nextcloud-secret: "{{`{{ .ncSecret }}`}}"
        s3-access-key: "{{`{{ .s3AccessKey }}`}}"
        s3-secret-key: "{{`{{ .s3SecretKey }}`}}"
        db-username: {{ .Values.secrets.dbUsername | quote }}
        db-password: "{{`{{ .dbPw }}`}}"
        {{- if $maria }}
        mariadb-password: "{{`{{ .dbPw }}`}}"
        mariadb-root-password: "{{`{{ .rootPw }}`}}"
        {{- else }}
        postgres-password: "{{`{{ .dbPw }}`}}"
        redis-password: "{{`{{ .redisPw }}`}}"
        {{- end }}
  # Shared, non-generatable creds from the seed (same for every tenant).
  data:
    - secretKey: s3AccessKey
      sourceRef:
        storeRef:
          name: {{ .Values.secrets.storeName }}
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.secrets.s3SeedSecret }}
        property: s3-access-key
    - secretKey: s3SecretKey
      sourceRef:
        storeRef:
          name: {{ .Values.secrets.storeName }}
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.secrets.s3SeedSecret }}
        property: s3-secret-key
  # Per-tenant random secrets — one generator invocation per field => distinct values.
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: {{ .Values.secrets.generatorName }}
      rewrite:
        - regexp:
            source: "password"
            target: "adminPw"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: {{ .Values.secrets.generatorName }}
      rewrite:
        - regexp:
            source: "password"
            target: "dbPw"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: {{ .Values.secrets.generatorName }}
      rewrite:
        - regexp:
            source: "password"
            target: "ncSecret"
    {{- if $maria }}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: {{ .Values.secrets.generatorName }}
      rewrite:
        - regexp:
            source: "password"
            target: "rootPw"
    {{- else }}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: {{ .Values.secrets.generatorName }}
      rewrite:
        - regexp:
            source: "password"
            target: "redisPw"
    {{- end }}
{{- end }}
