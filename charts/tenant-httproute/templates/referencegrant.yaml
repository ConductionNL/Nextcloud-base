{{- if and .Values.gateway.enabled .Values.gateway.referenceGrant .Values.tenant.tlsSecretName }}
# Laat de gedeelde Gateway het TLS-secret van deze tenant lezen. Naam-gescoped,
# read-only, en hij hoort hier omdat een ReferenceGrant altijd in de namespace
# staat die iets weggeeft — niet in de namespace die iets wil.
#
# De nginx-Ingress blijft hetzelfde secret gebruiken; dat is geen conflict.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateway-to-nextcloud-tls
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/part-of: nextcloud-platform
    nextcloud.platform/tenant: {{ .Values.tenant.name | quote }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.gateway.namespace }}
  to:
    - group: ""
      kind: Secret
      name: {{ .Values.tenant.tlsSecretName }}
{{- end }}
