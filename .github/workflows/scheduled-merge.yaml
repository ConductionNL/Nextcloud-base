---
# Merget PR's na 17:00 Amsterdam, valideert op canary, en promoveert pas daarna
# naar de rest van de vloot. Gaat het mis, dan draait hij terug.
#
# Waarom dit bestaat: tot 2026-08-05 volgden alle 76 tenant-apps `HEAD` van main.
# Een merge was daarmee de uitrol voor iedereen tegelijk — er was geen moment
# waarop je iets kon testen voordat de vloot het kreeg. Sinds de ApplicationSet
# per tenant een ref kiest, volgt canary main en volgt de rest `release`. Deze
# workflow is wat die twee refs bij elkaar brengt.
#
# De keten per PR, drie stappen met een poort ertussen:
#
#   probe alles vooraf      -> gezond? anders niets doen
#   merge naar main         -> alleen canary (wave 0) krijgt de wijziging
#   poll canary             -> gezond? dan pas verder
#     promoveer release-accept  -> accept-tenants krijgen hem
#     poll accept               -> gezond? dan pas verder
#       promoveer release       -> productie krijgt hem
#       poll live               -> ziek? `release` terug
#     accept ziek               -> `release-accept` terug, productie ongemoeid
#   canary ziek             -> geen ref verschoven, revert op main (zie onder)
#
# Productie loopt dus altijd achter op accept, en accept op canary. Een kapotte
# commit komt niet verder dan de laag waar hij stukloopt.
#
# WAAROM DE WACHTTIJDEN ZO LANG ZIJN: Argo's reconcile staat op 180s en daarna moet
# de pod nog rollen. Met een korte pauze gaf de probe groen terwijl de doeltenants
# nog op de oude commit liepen — precies wat er op 2026-08-05 in run 31033945944
# gebeurde, waar de canary-probe 31 seconden na de merge slaagde. De poort keurde
# toen niets. Vandaar SETTLE_SECONDS van 300 plus een streak van meerdere gezonde
# metingen op rij.
#
# WAT DEZE POORT NIET DOET: hij bewijst niet dat de wijziging is aangekomen, alleen
# dat er niets is omgevallen. Daarvoor zou CI de gedeployde revisie van de Argo-app
# moeten kunnen uitvragen, en dat vraagt een token dat er nu niet is.
#
# Wachtrij: opt-in per PR via een `merge-wave/<n>`-label. Zonder dat label doet
# deze workflow niets met een PR. Eén run werkt de HELE wachtrij af, in wave-orde
# en één PR per keer. Waves zijn de volgorde, niet een rem — de veiligheid zit in
# de canary-poort per PR en in het stoppen bij het eerste probleem. Wachten tot de
# volgende avond zou alleen een flessenhals toevoegen.
#
# Tenant-only PR's (`change/tenant-additive`) worden direct na de merge
# gepromoveerd zonder canary-poort. Een nieuw tenant-bestand kan bestaande
# tenants niet breken, en de generator volgt `release`, dus zonder promotie zou
# de tenant helemaal niet verschijnen.
#
# Wat expliciet NIET automatisch gebeurt: een revert op main van een wijziging die
# data heeft gemigreerd. Een image-tag of chart-versie terugzetten draait
# `occ upgrade` niet terug en zet een oude binary op een nieuw schema. Zulke PR's
# worden gedetecteerd op hun diff en dan wordt er alleen gealarmeerd. De vloot is
# op dat moment al beschermd doordat `release` niet is verschoven.

name: Scheduled merge (canary-poort, na 17:00 Amsterdam)

"on":
  schedule:
    # Elk uur, en de venstercheck in de eerste stap bepaalt of er iets gebeurt.
    #
    # Waarom uurlijks en niet één vast tijdstip: met één slot per avond wacht een PR
    # die om 21:00 groen wordt tot de volgende dag. Dat is dezelfde flessenhals als
    # één-wave-per-avond, alleen op de tijd-as. Uurlijks geeft ~14 kansen per
    # werkavond (17:00-07:00), en een gemiste kans kost een uur in plaats van een dag.
    #
    # Bijkomend voordeel: dit is zomertijd-proof zonder trucs. Eerst stonden er twee
    # crons (15:05 en 16:05 UTC) omdat GitHub alleen UTC kent en 17:05 lokaal per
    # seizoen verschuift. Nu doet de check op `TZ=Europe/Amsterdam` al het werk en is
    # de cron zelf onverschillig voor de klok.
    #
    # Kosten: buiten het venster stopt de run in de eerste stap, in enkele seconden.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen tonen wat er zou gebeuren"
        required: false
        default: true
        type: boolean
      ignore_window:
        description: "Tijdvenster negeren (handmatige run buiten 17:00-07:00)"
        required: false
        default: false
        type: boolean
      max_prs:
        description: "Maximaal aantal PR's in deze run (leeg = de hele wachtrij)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

# Deelt de groep met promote-tenant-changes.yaml: twee workflows die dezelfde
# `release`-pointer verzetten mogen nooit tegelijk lopen.
concurrency:
  group: release-pointer
  cancel-in-progress: false

jobs:
  merge-queue:
    name: Merge, valideer op canary, promoveer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Volledige historie: nodig om te reverten en om `release` te verzetten.
          fetch-depth: 0

      - name: Controleer tijdvenster (Europe/Amsterdam)
        id: window
        shell: bash
        run: |
          set -euo pipefail

          # Bewust lokale tijd en niet `date -u`: de policy is in Amsterdamse tijd
          # geformuleerd, en met UTC schuift het venster twee uur op in de zomer en
          # één uur in de winter.
          local_hour="$(TZ=Europe/Amsterdam date +%H)"
          local_dow="$(TZ=Europe/Amsterdam date +%u)"   # 1=ma ... 7=zo
          echo "Amsterdam: $(TZ=Europe/Amsterdam date '+%F %T %Z') (dag ${local_dow}, uur ${local_hour})"

          if [[ "${{ inputs.ignore_window }}" == "true" ]]; then
            echo "Venster genegeerd op verzoek van de handmatige run."
            echo "proceed=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # Toegestaan: ma t/m do vanaf 17:00, en de nacht erna tot 07:00.
          # Vrijdagavond en het weekend niet — dan is er niemand om een probleem
          # op te pakken.
          proceed=false
          if [[ "${local_dow}" -ge 1 && "${local_dow}" -le 4 && "${local_hour}" -ge 17 ]]; then
            proceed=true
          elif [[ "${local_dow}" -ge 2 && "${local_dow}" -le 5 && "${local_hour}" -lt 7 ]]; then
            proceed=true
          fi

          if [[ "${proceed}" != "true" ]]; then
            echo "Buiten het uitrolvenster (ma-do 17:00-07:00). Niets gedaan."
          fi
          echo "proceed=${proceed}" >>"$GITHUB_OUTPUT"

      - name: Stel de wachtrij samen
        id: queue
        if: steps.window.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title,labels,mergeable,mergeStateStatus \
            >/tmp/prs.json

          python3 - <<'PY' >/tmp/queue.txt
          import json, re

          wave_re = re.compile(r"^merge-wave/(\d+)$")
          rows = []
          for pr in json.load(open("/tmp/prs.json")):
              labels = [l["name"] for l in pr["labels"]]
              waves = [int(m.group(1)) for m in map(wave_re.match, labels) if m]
              if not waves:
                  continue
              kind = "tenant" if "change/tenant-additive" in labels else "platform"
              rows.append((min(waves), pr["number"], kind, pr["title"]))
          for wave, num, kind, title in sorted(rows):
              print(f"{wave}\t{num}\t{kind}\t{title}")
          PY

          if [[ ! -s /tmp/queue.txt ]]; then
            echo "count=0" >>"$GITHUB_OUTPUT"
            echo "Geen PR's met een merge-wave-label. Niets te doen."
            exit 0
          fi

          # De hele wachtrij in één run, in wave-orde, één PR per keer. Waves zijn
          # de volgorde, niet een rem: wachten tot morgen zou een flessenhals zijn
          # die niets toevoegt. De veiligheid zit in de canary-poort per PR en in
          # het stoppen bij het eerste probleem.
          echo "Wachtrij (wave, PR, soort, titel):"
          cat /tmp/queue.txt

          # max_prs is er voor een handmatige run waarin je bewust één stap wil
          # zetten. Bij een geplande run is hij leeg en gaat de hele rij door.
          max_prs="${{ inputs.max_prs }}"
          if [[ -n "${max_prs}" ]]; then
            if [[ ! "${max_prs}" =~ ^[0-9]+$ ]]; then
              echo "error: max_prs moet een getal zijn, kreeg '${max_prs}'" >&2
              exit 1
            fi
            head -n "${max_prs}" /tmp/queue.txt >/tmp/queue.limited
            mv /tmp/queue.limited /tmp/queue.txt
            echo "Beperkt tot de eerste ${max_prs}:"
            cat /tmp/queue.txt
          fi

          count="$(wc -l </tmp/queue.txt | tr -d ' ')"
          echo "count=${count}" >>"$GITHUB_OUTPUT"

      - name: Merge, valideer en promoveer
        if: steps.window.outputs.proceed == 'true' && steps.queue.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          # SETTLE_SECONDS is de minimale wachttijd vóórdat een probe meetelt, en
          # dat getal is niet willekeurig. Argo's `timeout.reconciliation` staat op
          # de default van 180s, en daarna moet de pod nog rollen. Met de vorige
          # waarde van 30s gaf de probe groen op poging 1 terwijl de doel-tenants nog
          # op de oude commit liepen — gemeten in run 31033945944 (probe geslaagd 31s
          # na de merge) en bevestigd doordat een vloot-tenant pas ~3 minuten later
          # op de nieuwe revisie stond. De poort keurde dus niets.
          SETTLE_SECONDS: "300"
          PROBE_ATTEMPTS: "18"
          PROBE_INTERVAL: "20"
          # Eén gezonde meting kan een pod treffen die nog niet is begonnen aan zijn
          # rolling update. Drie op rij, met PROBE_INTERVAL ertussen, dekt dat af.
          HEALTHY_STREAK: "3"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          read_hosts() {
            local file="$1" line
            while IFS= read -r line; do
              line="${line%%#*}"
              line="$(echo "${line}" | tr -d '[:space:]')"
              [[ -n "${line}" ]] && echo "${line}"
            done <"${file}"
          }

          mapfile -t CANARY_HOSTS < <(read_hosts .github/probe-hosts-canary.txt)
          mapfile -t ACCEPT_HOSTS < <(read_hosts .github/probe-hosts-accept.txt)
          mapfile -t LIVE_HOSTS < <(read_hosts .github/probe-hosts-live.txt)

          if [[ "${#CANARY_HOSTS[@]}" -eq 0 || "${#ACCEPT_HOSTS[@]}" -eq 0 \
            || "${#LIVE_HOSTS[@]}" -eq 0 ]]; then
            echo "error: probe-lijsten zijn leeg; weiger blind te mergen" >&2
            exit 1
          fi
          echo "Canary-hosts: ${CANARY_HOSTS[*]}"
          echo "Accept-hosts: ${ACCEPT_HOSTS[*]}"
          echo "Live-hosts  : ${LIVE_HOSTS[*]}"

          host_healthy() {
            local host="$1" code body
            code="$(curl -s -m 15 -o /tmp/status.json -w '%{http_code}' \
              "https://${host}/status.php" || echo "000")"
            body="$(cat /tmp/status.json 2>/dev/null || true)"
            [[ "${code}" == "200" ]] \
              && grep -q '"installed":true' <<<"${body}" \
              && ! grep -q '"maintenance":true' <<<"${body}"
          }

          # probe_until <benodigde-streak> <host...>
          # Vraagt HEALTHY_STREAK opeenvolgende gezonde rondes voordat het als
          # gezond geldt. Eén gezonde meting zegt weinig: die kan een pod treffen die
          # nog niet aan zijn rolling update begonnen is.
          probe_until() {
            local streak_needed="$1"; shift
            local hosts=("$@") attempt host all_ok streak=0
            for ((attempt = 1; attempt <= PROBE_ATTEMPTS; attempt++)); do
              all_ok=true
              for host in "${hosts[@]}"; do
                if ! host_healthy "${host}"; then
                  echo "  poging ${attempt}/${PROBE_ATTEMPTS}: ${host} nog niet gezond"
                  all_ok=false
                fi
              done
              if [[ "${all_ok}" == "true" ]]; then
                streak=$((streak + 1))
                echo "  gezond (poging ${attempt}, ${streak}/${streak_needed} op rij)"
                if [[ "${streak}" -ge "${streak_needed}" ]]; then
                  return 0
                fi
              else
                # Eén slechte ronde zet de teller terug: we willen een aaneengesloten
                # gezonde periode, geen gemiddelde.
                streak=0
              fi
              sleep "${PROBE_INTERVAL}"
            done
            return 1
          }

          # settle <fase> — wacht tot Argo gereconcilieerd kan hebben en de pods
          # gerold zijn. Zonder deze pauze meet de probe de oude staat.
          settle() {
            echo "  wachten ${SETTLE_SECONDS}s ($1): Argo reconcile (180s) + pod-roll"
            sleep "${SETTLE_SECONDS}"
          }

          escalate() {
            local title="$1" body="$2"
            echo "::error::${title}"
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "${title}" \
              --body "${body}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              >/dev/null || echo "::warning::issue aanmaken faalde"
          }

          # promote_to <ref> <sha> — schuift een release-ref naar de commit.
          # Fast-forward, dus dit kan niets overschrijven wat er niet al in zit.
          promote_to() {
            local ref="$1" sha="$2"
            echo "Promoveren: ${ref} -> ${sha}"
            git push origin "${sha}:refs/heads/${ref}"
          }

          # demote_to <ref> <oude-sha> <huidige-sha> — zet een release-ref terug. Dit
          # is de goedkoopste rollback die er is: alleen een pointer, geen nieuwe
          # commit, en main blijft ongemoeid. Wel een force-push — uitsluitend op een
          # release-ref, nooit op main.
          demote_to() {
            local ref="$1" old="$2" new="$3"
            echo "Terugdraaien: ${ref} ${new} -> ${old}"
            git push --force-with-lease="refs/heads/${ref}:${new}" \
              origin "${old}:refs/heads/${ref}"
          }

          # Een diff die een image-tag of chart-versie aanraakt kan een
          # datamigratie hebben gedraaid. Die reverten zet een oude binary op een
          # nieuw schema, wat erger is dan de storing.
          migration_bearing() {
            local sha="$1"
            # charts/ staat in de repo-root, values/ onder nextcloud-platform/.
            git diff "${sha}^1" "${sha}" -- \
              'nextcloud-platform/values/**' 'charts/**' \
              | grep -qE '^\+[[:space:]]*(tag|version|chartVersion):'
          }

          # GitHub berekent mergeability lazy. Direct na een merge is de waarde voor
          # de volgende PR's `UNKNOWN` — dat betekent "nog niet berekend", niet
          # "niet mergebaar". Eén uitvraag was daardoor genoeg om elke PR ná de
          # eerste over te slaan; gemeten in run 31026343726 op 2026-08-05, waar
          # #22 en #21 beide op UNKNOWN/UNKNOWN werden overgeslagen. Uitvragen
          # triggert de berekening, dus doorvragen tot er een echte waarde staat.
          fetch_pr_state() {
            local pr="$1" attempt fresh mergeable
            for ((attempt = 1; attempt <= 12; attempt++)); do
              fresh="$(gh pr view "${pr}" --repo "$GITHUB_REPOSITORY" \
                --json state,mergeable,mergeStateStatus,statusCheckRollup)"
              mergeable="$(jq -r '.mergeable' <<<"${fresh}")"
              if [[ "${mergeable}" != "UNKNOWN" ]]; then
                [[ "${attempt}" -gt 1 ]] \
                  && echo "  mergeability na ${attempt} pogingen: ${mergeable}" >&2
                echo "${fresh}"
                return 0
              fi
              sleep 5
            done
            echo "  mergeability bleef UNKNOWN na 12 pogingen (1 minuut)" >&2
            echo "${fresh}"
          }

          echo "::group::Beginsituatie"
          # Hier geen settle: we meten de staat zoals hij nu is, niet na een
          # wijziging. Wel een streak, zodat een toevallige hik niet meteen de
          # hele run blokkeert.
          if ! probe_until "${HEALTHY_STREAK}" \
            "${CANARY_HOSTS[@]}" "${ACCEPT_HOSTS[@]}" "${LIVE_HOSTS[@]}"; then
            escalate "Scheduled merge niet gestart: vloot was al niet gezond" \
              "De run stopte vóór de eerste merge omdat minstens één probe-host niet gezond was. Er is niets gemerged en niets gepromoveerd."
            exit 1
          fi
          echo "::endgroup::"

          while IFS=$'\t' read -r wave pr kind title; do
            echo "::group::wave ${wave} — PR #${pr} (${kind}): ${title}"

            fresh="$(fetch_pr_state "${pr}")"
            pr_state="$(jq -r '.state' <<<"${fresh}")"
            pr_mergeable="$(jq -r '.mergeable' <<<"${fresh}")"
            pr_merge_state="$(jq -r '.mergeStateStatus' <<<"${fresh}")"
            failing="$(jq -r '[.statusCheckRollup[]? | select((.conclusion // "") | test("FAILURE|CANCELLED|TIMED_OUT"))] | length' <<<"${fresh}")"
            pending="$(jq -r '[.statusCheckRollup[]? | select((.status // "") == "IN_PROGRESS" or (.status // "") == "QUEUED")] | length' <<<"${fresh}")"

            if [[ "${pr_state}" != "OPEN" ]]; then
              echo "Overgeslagen: staat niet meer open (${pr_state})."
              echo "::endgroup::"; continue
            fi
            if [[ "${pr_mergeable}" != "MERGEABLE" || "${pr_merge_state}" == "DIRTY" ]]; then
              echo "Overgeslagen: niet mergebaar (${pr_mergeable}/${pr_merge_state})."
              echo "::endgroup::"; continue
            fi
            if [[ "${failing}" != "0" || "${pending}" != "0" ]]; then
              echo "Overgeslagen: ${failing} falende en ${pending} lopende checks."
              echo "::endgroup::"; continue
            fi

            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "dry-run: zou #${pr} mergen, canary pollen en bij succes promoveren."
              echo "::endgroup::"; continue
            fi

            git fetch origin main release release-accept --quiet
            release_before="$(git rev-parse origin/release)"
            accept_before="$(git rev-parse origin/release-accept)"

            echo "Mergen naar main (alleen canary krijgt dit)..."
            if ! gh pr merge "${pr}" --repo "$GITHUB_REPOSITORY" --merge; then
              escalate "Scheduled merge: mergen van PR #${pr} faalde" \
                "\`gh pr merge\` gaf een fout op PR #${pr}. Er is niets gepromoveerd."
              echo "::endgroup::"; exit 1
            fi

            git fetch origin main --quiet
            main_after="$(git rev-parse origin/main)"
            echo "main staat nu op ${main_after}, release nog op ${release_before}"

            # Tenant-only: geen canary-poort. Een nieuw tenant-bestand kan bestaande
            # tenants niet breken, en zonder promotie ziet de generator (die
            # `release` volgt) de tenant helemaal niet. Beide refs schuiven mee,
            # anders zou een accept-tenant wél renderen en een prod-tenant niet.
            if [[ "${kind}" == "tenant" ]]; then
              promote_to release-accept "${main_after}"
              promote_to release "${main_after}"
              settle "tenant-promotie"
              if ! probe_until "${HEALTHY_STREAK}" \
                "${ACCEPT_HOSTS[@]}" "${LIVE_HOSTS[@]}"; then
                demote_to release "${release_before}" "${main_after}"
                demote_to release-accept "${accept_before}" "${main_after}"
                escalate "Scheduled merge: vloot niet gezond na tenant-PR #${pr}" \
                  "PR #${pr} is gemerged en gepromoveerd, maar de probes bleven falen.
          Beide release-refs zijn teruggezet (release naar ${release_before},
          release-accept naar ${accept_before}). main staat nog op ${main_after} — de merge
          zelf is niet ongedaan gemaakt."
                echo "::endgroup::"; exit 1
              fi
              echo "PR #${pr} gemerged, gepromoveerd en vloot gezond."
              echo "::endgroup::"; continue
            fi

            # Stap 1: canary. Die volgt main en heeft de wijziging dus al.
            echo "Canary pollen..."
            settle "canary"
            if ! probe_until "${HEALTHY_STREAK}" "${CANARY_HOSTS[@]}"; then
              canary_failed=true
            else
              canary_failed=false
            fi

            if [[ "${canary_failed}" == "false" ]]; then
              # Stap 2: accept. Productie blijft hier nog buiten.
              echo "Canary gezond. Promoveren naar accept."
              promote_to release-accept "${main_after}"
              settle "accept"
              if ! probe_until "${HEALTHY_STREAK}" "${ACCEPT_HOSTS[@]}"; then
                demote_to release-accept "${accept_before}" "${main_after}"
                escalate "Scheduled merge: accept niet gezond na PR #${pr}" \
                  "Canary was gezond, maar na de promotie naar accept bleven de accept-probes
          falen. \`release-accept\` is teruggezet naar ${accept_before}. Productie is niet
          geraakt: \`release\` staat nog op ${release_before}. main en canary houden de
          wijziging — dat verschil is het onderzoeksmateriaal."
                echo "::endgroup::"; exit 1
              fi

              # Stap 3: productie.
              echo "Accept gezond. Promoveren naar de rest."
              promote_to release "${main_after}"
              settle "live"
              if ! probe_until "${HEALTHY_STREAK}" "${LIVE_HOSTS[@]}"; then
                demote_to release "${release_before}" "${main_after}"
                escalate "Scheduled merge: productie niet gezond na PR #${pr}" \
                  "Canary en accept waren gezond, maar na de laatste promotie bleven de
          live-probes falen. \`release\` is teruggezet naar ${release_before}.
          \`release-accept\` blijft op ${main_after}, dus accept houdt de wijziging en
          productie niet — precies het verschil dat je wil kunnen vergelijken."
                echo "::endgroup::"; exit 1
              fi
              echo "PR #${pr} gemerged, canary gezond, accept gezond, productie gezond."
              echo "::endgroup::"; continue
            fi

            # Canary niet gezond. Accept en productie hebben de wijziging nooit
            # gezien, want geen van beide release-refs is verschoven — dat is de
            # borging. Rest de vraag of we canary zelf terugdraaien.
            echo "::warning::Canary niet gezond na PR #${pr}. Geen ref verschoven."
            if migration_bearing "${main_after}"; then
              escalate "Scheduled merge: canary stuk na PR #${pr}, GEEN automatische revert" \
                "De canary-probes bleven falen na PR #${pr}. \`release\` is niet verschoven, dus de vloot is niet geraakt.

          Er is **niet** automatisch gereverteerd: de diff raakt een image-tag of
          chart-versie, dus er kan een datamigratie zijn gedraaid. Een revert zou een oude
          binary op een nieuw schema zetten. Dit vraagt een mens.

          main: ${main_after} — release: ${release_before}"
              echo "::endgroup::"; exit 1
            fi

            echo "Diff is declaratief, main terugdraaien..."
            git checkout -B rollback-tmp "${main_after}" --quiet
            if git revert --no-edit -m 1 "${main_after}" >/dev/null 2>&1 \
              && git push origin HEAD:main --quiet; then
              escalate "Scheduled merge: canary stuk na PR #${pr}, main gereverteerd" \
                "De canary-probes bleven falen na PR #${pr}. \`release\` is nooit verschoven, dus de vloot is niet geraakt. De merge is op main gereverteerd, dus canary komt terug op de vorige staat.

          PR #${pr} staat weer open te wachten op een fix; het wave-label is eraf gehaald zodat hij niet vanavond opnieuw wordt geprobeerd."
              gh pr edit "${pr}" --repo "$GITHUB_REPOSITORY" \
                --remove-label "merge-wave/${wave}" >/dev/null || true
            else
              escalate "Scheduled merge: canary stuk na PR #${pr} en de revert faalde" \
                "De canary-probes bleven falen en de automatische revert op main lukte niet.
          \`release\` is niet verschoven, dus de vloot is beschermd, maar canary staat nu op
          een kapotte commit (${main_after}) en vraagt handwerk."
            fi
            echo "::endgroup::"; exit 1
          done </tmp/queue.txt

