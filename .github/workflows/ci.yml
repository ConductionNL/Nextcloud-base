# SPDX-License-Identifier: EUPL-1.2
#
# Server-side gate op elke PR en elke push naar main.
#
# Zonder dit draait de docs-gate alleen bij wie `pre-commit install` heeft
# gedaan. Een PR van iemand zonder hooks passeert dan ongecontroleerd, terwijl
# die hooks juist de afspraak zijn dat docs meebewegen met de code.
#
# De workflow herimplementeert niets: hij draait dezelfde hooks uit
# `.pre-commit-config.yaml`. Een tweede lijst met checks is een tweede lijst
# die gaat afwijken.
#
# `--hook-stage pre-push` is niet optioneel: de `verify`-hook is als pre-push
# gedeclareerd en draait zonder die vlag stilzwijgend niet, waarmee een groene
# CI niets zou betekenen.
#
# LET OP: dit gate't wat een hook kán controleren — front-matter, index,
# CODEOWNERS, uitvoerbare doc-blokken, de eigen verify. Niet of de prozatekst
# nog klopt met de code; daar is de periodieke semantische review voor.
name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeren wat de hooks nodig hebben
        # uv: de docs-contract-hook van techbook shelt ernaar uit ("Python
        # tooling via uv, never pip directly"); zonder uv faalt die hook.
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit uv

      # kubeconform staat niet op de runner-image; helm, yq en kubectl wel.
      # `smoke-checks.sh` eist alle vier en stopt zonder het te melden: die
      # melding gaat naar stdout en `verify.sh` gooit stdout weg. Dat kostte
      # een sessie diagnose — vandaar ook de controlestap hieronder.
      # Versie én checksum gepind: een gate die bij een nieuwe upstream-release
      # kan omvallen, of stilletjes een ander binair bestand draait, is geen gate.
      - name: kubeconform installeren
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      # Faalt luid en met naam, in plaats van tien regels verderop stil.
      - name: Gereedschap aanwezig
        run: |
          set -euo pipefail
          missing=()
          for tool in helm yq kubeconform kubectl yamllint; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::ontbrekend gereedschap op de runner: ${missing[*]}"
            exit 1
          fi

      - name: Dezelfde hooks als lokaal
        run: pre-commit run --all-files --show-diff-on-failure --hook-stage pre-push
