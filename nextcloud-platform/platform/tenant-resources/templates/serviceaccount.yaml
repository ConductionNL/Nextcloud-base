{{- if eq (default "mariadb" .Values.tenant.dbType) "postgres" }}
---
# ServiceAccount for the copy-admin-secret job, scoped to the tenant namespace.
# The platform SA in nextcloud-platform cannot be used cross-namespace by pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-generator
  namespace: {{ default .Values.tenant.name .Values.tenant.namespace }}
  labels:
    {{- include "tenant-resources.labels" . | nindent 4 }}

---
# Bind this tenant-namespace SA to the existing platform ClusterRole.
# Named with tenant suffix to avoid collisions across tenants.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nextcloud-secret-generator-{{ .Values.tenant.name }}
  labels:
    {{- include "tenant-resources.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: secret-generator
    namespace: {{ default .Values.tenant.name .Values.tenant.namespace }}
roleRef:
  kind: ClusterRole
  name: nextcloud-secret-generator
  apiGroup: rbac.authorization.k8s.io
{{- end }}
