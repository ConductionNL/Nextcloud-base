---
# Root kustomization for the nextcloud-platform Application.
# Platform components (redis, pgbouncer, externalsecrets) are managed by
# their own dedicated Argo CD Applications — do not add them here to avoid
# SharedResourceWarning conflicts.
# Add only resources that have no dedicated component app.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nextcloud-platform

resources:
  # SA + RBAC for secret operations (used by pgbouncer-secret-check and tenant jobs)
  # ClusterSecretStore is excluded — requires ESO CRD which is not installed
  - externalsecrets/rbac.yaml
