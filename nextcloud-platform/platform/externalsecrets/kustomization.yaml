---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nextcloud-platform

resources:
  # clustersecretstore.yaml is intentionally EXCLUDED: it requires the
  # external-secrets.io ClusterSecretStore CRD, and the External Secrets
  # Operator is NOT installed on this cluster (the fallback secret Job is used
  # instead — see docs/SECRETS.md). Including it makes the app SyncFailed.
  # Re-add this line only after ESO + its CRDs are installed cluster-wide.
  # - clustersecretstore.yaml
  - rbac.yaml

commonLabels:
  app.kubernetes.io/name: external-secrets
  app.kubernetes.io/component: secrets-management
  app.kubernetes.io/part-of: nextcloud-platform
  app.kubernetes.io/managed-by: argocd

