---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nextcloud-platform

resources:
  # clustersecretstore.yaml holds the ClusterSecretStore + ClusterGenerator.
  # ORDERING: these need the external-secrets.io CRDs, installed by cluster-infra's
  # `external-secrets` Application. Deploy/sync THAT first; then this syncs cleanly.
  # (Re-excluded only if ESO is ever removed cluster-wide.)
  - clustersecretstore.yaml
  - rbac.yaml

commonLabels:
  app.kubernetes.io/name: external-secrets
  app.kubernetes.io/component: secrets-management
  app.kubernetes.io/part-of: nextcloud-platform
  app.kubernetes.io/managed-by: argocd

