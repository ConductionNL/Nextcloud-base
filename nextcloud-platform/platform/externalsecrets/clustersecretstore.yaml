---
# ESO consumer config for the Nextcloud platform (the OPERATOR is installed by
# cluster-infra; this repo only configures how we use it).
#
# Two pieces:
#  1. ClusterSecretStore (kubernetes provider) — reads the SHARED, non-generatable
#     credentials (the Fuga S3 access/secret key) from one central seed Secret in
#     the nextcloud-platform namespace. These are the same for every tenant.
#  2. ClusterGenerator (Password) — generates the PER-TENANT random secrets
#     (admin / db / redis / nextcloud salt). Referenced cluster-wide so a single
#     definition serves every tenant namespace.
#
# A per-tenant ExternalSecret (charts/tenant-secret) combines the two into the
# tenant's `nextcloud-secrets`. It is rendered ONLY for tenants with
# `tenant.secrets.managed: true` — new (web-UI-created) tenants. Existing tenants
# keep their script-applied secret untouched (no rotation).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: nextcloud-shared-store
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secrets-management
    app.kubernetes.io/part-of: nextcloud-platform
spec:
  provider:
    kubernetes:
      # The seed Secret (S3 creds) lives here; created out-of-band, never in Git.
      remoteNamespace: nextcloud-platform
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: nextcloud-platform
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets-reader
          namespace: nextcloud-platform

---
# Password generator for the per-tenant random secrets. ClusterGenerator is
# cluster-scoped, so the per-tenant ExternalSecret in any namespace can reference
# it. Symbols disabled to keep values safe inside DB DSNs / Redis URLs / env.
# Verified 2026-06-22 against ESO v2.6.0 CRDs: ClusterGenerator is served at
# generators.external-secrets.io/v1alpha1 and every passwordSpec field below
# (length/digits/symbols/symbolCharacters/noUpper/allowRepeat) exists in 2.6.0.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: nextcloud-password
  labels:
    app.kubernetes.io/part-of: nextcloud-platform
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 32
      digits: 6
      symbols: 0
      symbolCharacters: ""
      noUpper: false
      allowRepeat: true
