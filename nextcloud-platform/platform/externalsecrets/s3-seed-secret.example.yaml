# EXAMPLE / TEMPLATE ONLY — do NOT commit real values, and this file is NOT in
# kustomization.yaml. The shared Fuga S3 credentials are the same for every
# tenant; ESO reads them from this ONE seed Secret (via the nextcloud-shared-store
# ClusterSecretStore) and copies them into each tenant's nextcloud-secrets.
#
# Create out-of-band (the keys live today in scripts/.env):
#   set -a && source scripts/.env && set +a
#   kubectl create secret generic nextcloud-s3-seed -n nextcloud-platform \
#     --from-literal=s3-access-key="$S3_ACCESS_KEY" \
#     --from-literal=s3-secret-key="$S3_SECRET_KEY"
#
# Property names here MUST match the remoteRef.property values in
# charts/tenant-secret/templates/externalsecret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-s3-seed
  namespace: nextcloud-platform
  labels:
    app.kubernetes.io/part-of: nextcloud-platform
type: Opaque
stringData:
  s3-access-key: "REPLACE_WITH_FUGA_S3_ACCESS_KEY"
  s3-secret-key: "REPLACE_WITH_FUGA_S3_SECRET_KEY"
