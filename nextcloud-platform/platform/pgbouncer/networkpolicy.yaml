---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer
  namespace: nextcloud-platform
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: database-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
  policyTypes:
    - Ingress
  ingress:
    # Allow PostgreSQL connections from all Nextcloud tenant namespaces.
    # Argo CD sets app.kubernetes.io/part-of: nextcloud-platform on every
    # tenant namespace via managedNamespaceMetadata, so no manual updates
    # are needed when adding new tenants.
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: nextcloud-platform
      ports:
        - protocol: TCP
          port: 5432
    # Allow metrics scraping from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9127
