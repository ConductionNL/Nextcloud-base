---
# PgBouncer uses the same postgres-admin secret as database provisioning
# This Job just verifies the secret exists
apiVersion: batch/v1
kind: Job
metadata:
  name: pgbouncer-secret-check
  namespace: nextcloud-platform
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: secret-check
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/component: secret-check
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: secret-generator
      containers:
        - name: check
          image: alpine/k8s:1.28.13
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -c
            - |
              set -e

              SECRET_NAME="postgres-admin"
              NAMESPACE="nextcloud-platform"
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              API="https://kubernetes.default.svc/api/v1/namespaces/${NAMESPACE}/secrets/${SECRET_NAME}"

              echo "Checking for PostgreSQL admin secret..."

              # Use curl entirely in-memory (readOnlyRootFilesystem=true, no disk writes)
              RESPONSE=$(curl -s -w "\n%{http_code}" --cacert "$CACERT" \
                -H "Authorization: Bearer $TOKEN" "$API")
              HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -1)
              BODY=$(printf '%s' "$RESPONSE" | head -n -1)

              if [ "$HTTP_CODE" = "200" ]; then
                echo "✓ Secret $SECRET_NAME exists"

                # Verify required keys exist in the secret data
                for key in host port username password; do
                  if printf '%s' "$BODY" | grep -q "\"$key\":"; then
                    echo "  ✓ Key '$key' present"
                  else
                    echo "  ✗ Key '$key' missing!"
                    exit 1
                  fi
                done

                echo ""
                echo "All required keys present."
                exit 0
              else
                echo ""
                echo "=========================================="
                echo "ERROR: PostgreSQL admin secret not found!"
                echo "  (HTTP $HTTP_CODE from Kubernetes API)"
                echo "=========================================="
                echo ""
                echo "Create it with:"
                echo ""
                echo "  export POSTGRES_HOST='your-postgresql-host'"
                echo "  export POSTGRES_PORT='5432'"
                echo "  export POSTGRES_ADMIN_USER='postgres'"
                echo "  export POSTGRES_ADMIN_PASSWORD='your-admin-password'"
                echo "  ./scripts/create-postgres-admin-secret.sh"
                echo ""
                exit 1
              fi
