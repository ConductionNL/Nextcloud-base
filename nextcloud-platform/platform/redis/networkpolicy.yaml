---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: nextcloud-platform
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Redis connections from all Nextcloud tenant namespaces.
    # Argo CD sets app.kubernetes.io/part-of: nextcloud-platform on every
    # tenant namespace via managedNamespaceMetadata, so no manual updates
    # are needed when adding new tenants.
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: nextcloud-platform
      ports:
        - protocol: TCP
          port: 6379
    # Allow metrics scraping from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9121
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

