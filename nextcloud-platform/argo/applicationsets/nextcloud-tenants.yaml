---
# ApplicationSet that generates Nextcloud Applications for each tenant
# Tenants are defined by files in nextcloud-platform/values/tenants/
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nextcloud-tenants
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  # Enable Go templating so we can safely default missing keys.
  # This keeps existing tenants working when tenant.namespace is not set.
  goTemplate: true
  # We reference .tenant.namespace with a default; it may be missing for older tenants.
  goTemplateOptions: ["missingkey=default"]
  # Prevent accidental deletion of tenant applications
  syncPolicy:
    preserveResourcesOnDeletion: true
  
  # Generator: create one Application per tenant file
  # Alle tenant-*.yaml bestanden worden automatisch opgepikt
  # UITGEZONDERD: templates/tenant-template.yaml (staat in andere folder)
  # De generator volgt `release`, niet main. Zo komen een Application en de
  # values-bestanden waaruit hij rendert altijd van dezelfde commit. Zou de
  # generator main volgen, dan bestond een nieuwe tenant-Application al terwijl
  # zijn values-bestand nog niet op `release` staat; met
  # `ignoreMissingValueFiles: true` wordt dat bestand dan stil overgeslagen en
  # rendert de tenant met alleen de defaults. Dat faalt niet, het gaat verkeerd.
  #
  # Gevolg: een nieuwe tenant verschijnt pas na promotie. Voor tenant-only
  # wijzigingen promoveert scheduled-merge.yaml direct na de merge, dus dat is een
  # kwestie van een minuut.
  generators:
    - git:
        repoURL: "https://github.com/ConductionNL/Nextcloud-base.git"
        revision: release
        files:
          - path: "nextcloud-platform/values/tenants/tenant-*.yaml"
  
  # Application template
  template:
    metadata:
      name: "nc-{{ .tenant.name }}"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: nextcloud-platform
        nextcloud.platform/tenant: "{{ .tenant.name }}"
        nextcloud.platform/environment: "{{ .tenant.environment }}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{ default \"1\" .tenant.wave }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: nextcloud-platform
      
      # Source: Nextcloud Helm chart with our values
      sources:
        # Main Nextcloud Helm chart
        - repoURL: "https://nextcloud.github.io/helm/"
          chart: nextcloud
          # Default chart version for stable tenants. Canary/staged upgrades can
          # override per tenant via tenant.chartVersion in the tenant YAML.
          targetRevision: "{{ default \"8.9.0\" .tenant.chartVersion }}"
          helm:
            releaseName: "nextcloud"
            # Canary tenants load canary-overrides.yaml; non-canary tenants resolve the
            # templated name to a missing file, which this flag skips. Generated apps
            # always have their tenant-*.yaml (the generator globs existing files), so
            # this does not mask a real typo.
            ignoreMissingValueFiles: true
            valueFiles:
              - "$values/nextcloud-platform/values/common.yaml"
              - "$values/nextcloud-platform/values/env/{{ .tenant.environment }}.yaml"
              # Fallback for a tenant file without tenant.dbType. This is the
              # effective platform default — the enabled-flags in common.yaml are
              # always overridden by the db/ profile, which is layered after it.
              # Changed mariadb -> postgres on 2026-08-04 (MariaDB is legacy).
              # No effect on existing tenants: all 77 tenant files declare dbType,
              # so this branch is never taken for any of them.
              - "$values/nextcloud-platform/values/db/{{ default \"postgres\" .tenant.dbType }}.yaml"
              - "$values/nextcloud-platform/values/canary-overrides{{ if ne (toString .tenant.canary) \"true\" }}-DISABLED{{ end }}.yaml"
              - "$values/nextcloud-platform/values/tenants/tenant-{{ .tenant.name }}.yaml"
            values: |
              {{- $name := .tenant.name -}}
              {{- $suffix := regexFind "(accept|test|prod)$" $name -}}
              {{- $org := regexReplaceAll "-(accept|test|prod)$" $name "" -}}
              {{- $omgeving := default .tenant.environment $suffix -}}
              {{- $computedHost := "" -}}
              {{- if eq $omgeving "prod" -}}
              {{- $computedHost = printf "%s.commonground.nu" $org -}}
              {{- else -}}
              {{- $computedHost = printf "%s.%s.commonground.nu" $org $omgeving -}}
              {{- end -}}
              {{- $host := default $computedHost .tenant.hostname -}}
              {{- $apps := default (list "opencatalogi" "openconnector" "openregister") .tenant.apps.enabled -}}
              {{- $appsStr := join " " $apps -}}
              {{- $appapiEnabled := default false .tenant.features.appapi -}}
              {{- $phpMemoryLimit := default "2048M" .tenant.phpMemoryLimit -}}
              fullnameOverride: "nextcloud"
              commonLabels:
                nextcloud.platform/tenant: "{{ .tenant.name }}"
                nextcloud.platform/environment: "{{ .tenant.environment }}"
              # Derived defaults (keep tenant files thin)
              nextcloud:
                host: "{{ $host }}"
                trustedDomains:
                  - "{{ $host }}"
                extraEnv:
                  - name: PHP_MEMORY_LIMIT
                    value: "{{ $phpMemoryLimit }}"
                  - name: CONDUCTION_APPS
                    value: "{{ $appsStr }}"
                  - name: OPENCATALOGI_VERSION
                    value: "{{ default "" .tenant.apps.versions.opencatalogi }}"
                  - name: OPENCONNECTOR_VERSION
                    value: "{{ default "" .tenant.apps.versions.openconnector }}"
                  - name: OPENREGISTER_VERSION
                    value: "{{ default "" .tenant.apps.versions.openregister }}"
                  - name: APPAPI_ENABLED
                    value: '{{ ternary "true" "false" $appapiEnabled }}'
                  - name: APPAPI_DAEMON_MODE
                    value: '{{ default "manual-install" .tenant.appapi.mode }}'
                  - name: APPAPI_DAEMON_NAME
                    value: '{{ default "manual_install" .tenant.appapi.name }}'
                  - name: APPAPI_DAEMON_DISPLAY_NAME
                    value: '{{ default "Manual Install" .tenant.appapi.displayName }}'
                  - name: APPAPI_DAEMON_PROTOCOL
                    value: '{{ default "http" .tenant.appapi.protocol }}'
                  - name: APPAPI_DAEMON_HOST
                    value: '{{ default "null" .tenant.appapi.host }}'
                  - name: APPAPI_NEXTCLOUD_URL
                    value: '{{ default (printf "https://%s" $host) .tenant.appapi.nextcloudUrl }}'
                  # Stateless identity — injected so pods survive restarts without a PVC.
                  # Only needed while canary-overrides ships identity.config.php.
                  # Graduate: move to per-tenant secret pattern in Phase 2.
                  {{- if eq (toString .tenant.canary) "true" }}
                  - name: NEXTCLOUD_INSTANCEID
                    valueFrom:
                      secretKeyRef:
                        name: nextcloud-secrets
                        key: nextcloud-instanceid
                  - name: NEXTCLOUD_PASSWORDSALT
                    valueFrom:
                      secretKeyRef:
                        name: nextcloud-secrets
                        key: nextcloud-passwordsalt
                  - name: NEXTCLOUD_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: nextcloud-secrets
                        key: nextcloud-secret
                  {{- end }}
                  # S3 objectstore credentials — optional so accept tenants without S3
                  # keys in their secret don't fail to start.
                  - name: S3_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: nextcloud-secrets
                        key: s3-access-key
                        optional: true
                  - name: S3_SECRET_KEY
                    valueFrom:
                      secretKeyRef:
                        name: nextcloud-secrets
                        key: s3-secret-key
                        optional: true
                  # Per-tenant objectstore prefix — consumed by objectstore.config.php
                  # (currently canary-overrides only; graduates to env/prod.yaml).
                  - name: NEXTCLOUD_OBJECTSTORE_PREFIX
                    value: "{{ $name }}/"
              ingress:
                tls:
                  - secretName: "nextcloud-{{ $name }}-tls"
                    hosts:
                      - "{{ $host }}"
                hosts:
                  - host: "{{ $host }}"
                    paths:
                      - path: /
                        pathType: Prefix
              tenant:
                hostname: "{{ $host }}"
                s3:
                  bucket: "nextcloud"
                  prefix: "{{ $name }}/"
        
        # Our GitOps repo for values files
        #
        # Drie refs, drie stappen:
        #
        #   wave 0 (canary)        -> HEAD (main)
        #   environment: accept    -> release-accept
        #   de rest (productie)    -> release
        #
        # Een merge naar main raakt dus alleen canary. Blijkt die gezond, dan
        # schuift scheduled-merge.yaml `release-accept` vooruit; blijkt accept
        # gezond, dan pas `release`. Rollback per stap is het terugzetten van één
        # pointer, niet een revert.
        #
        # Productie loopt daarmee altijd achter op accept, en dat is het punt: een
        # fout die accept sloopt komt er nooit voorbij.
        #
        # Alle drie de git-sources hieronder MOETEN dezelfde ref gebruiken, anders
        # rendert een tenant values van de ene commit tegen charts van een andere.
        #
        # Discriminatoren zijn `tenant.wave` en `tenant.environment`, niet
        # `tenant.canary`. Die laatste hoort bij de geparkeerde emptyDir/S3-PoC
        # (canary-overrides.yaml) en staat op GEEN enkele tenant — dat zou de poort
        # subjectloos maken. `wave: "0"` staat op canary-prod en canary-accept en
        # betekent al "syncs first in every rollout"; `environment` is een verplicht
        # veld (validate-values.sh) en dus altijd gezet.
        #
        # LET OP: de generator volgt `release`, de laatste ref in de keten. Een
        # nieuwe tenant verschijnt dus pas als hij helemaal is doorgepromoveerd.
        # promote-tenant-changes.yaml schuift bij een tenant-only push daarom beide
        # refs vooruit, zodat onboarding niet op de keten hoeft te wachten.
        - repoURL: "https://github.com/ConductionNL/Nextcloud-base.git"
          targetRevision: '{{ if eq (toString .tenant.wave) "0" }}HEAD{{ else if eq .tenant.environment "accept" }}release-accept{{ else }}release{{ end }}'
          ref: values

        # AverageValue HPA — DISABLED fleet-wide.
        # Prod RS>1 is blocked by RWO Cinder PVCs (Multi-Attach): a 2nd replica can
        # never attach the single-writer volume, so minReplicas=2 leaves every prod
        # tenant Degraded (stuck Init/FailedAttachVolume). Keep HPA off until the
        # stateless/S3-primary HA path lands (cf. env/prod.yaml: replicaCount 1,
        # hpa.enabled false). Re-enable per-environment only once RS>1 is safe.
        - repoURL: "https://github.com/ConductionNL/Nextcloud-base.git"
          targetRevision: '{{ if eq (toString .tenant.wave) "0" }}HEAD{{ else if eq .tenant.environment "accept" }}release-accept{{ else }}release{{ end }}'
          path: charts/tenant-hpa
          helm:
            releaseName: "nextcloud-hpa"
            values: |
              hpa:
                enabled: false

        # ESO-managed nextcloud-secrets (NEW tenants only). Renders nothing unless
        # the tenant file sets tenant.secrets.managed: true — so existing tenants'
        # script-applied secrets are never touched. Needs ESO + the ClusterSecretStore
        # / ClusterGenerator (platform/externalsecrets) + the S3 seed Secret.
        - repoURL: "https://github.com/ConductionNL/Nextcloud-base.git"
          targetRevision: '{{ if eq (toString .tenant.wave) "0" }}HEAD{{ else if eq .tenant.environment "accept" }}release-accept{{ else }}release{{ end }}'
          path: charts/tenant-secret
          helm:
            releaseName: "nextcloud-secret"
            values: |
              tenant:
                name: "{{ .tenant.name }}"
                dbType: "{{ default "postgres" .tenant.dbType }}"
              secrets:
                managed: {{ default false .tenant.secrets.managed }}

        # De Gateway API-route van een tenant staat BEWUST niet hier maar in de
        # aparte ApplicationSet `nextcloud-tenant-routes`. Een vierde source
        # toevoegen verandert de spec van álle 84 tenant-Applications en laat ze
        # allemaal hersyncen, ook al rendert de chart voor 83 van hen niets.
        # Zie die ApplicationSet voor de afweging.
      
      # Destination: tenant-specific namespace
      destination:
        server: https://kubernetes.default.svc
        # Namespace is tenant-configurable (must be unique per tenant).
        # Convention: <organisatie>-<omgeving> (e.g. "alkmaar-accept", "alkmaar-prod")
        # Default: tenant.name (so tenant.name should follow the same convention)
        namespace: "{{ default .tenant.name .tenant.namespace }}"
      
      # Sync policy
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        # When ArgoCD auto-creates namespaces (CreateNamespace=true),
        # ensure they carry the platform label required by NetworkPolicies
        # (e.g. platform Redis ingress allowlist).
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/part-of: nextcloud-platform
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      
      revisionHistoryLimit: 10
      
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: autoscaling
          kind: HorizontalPodAutoscaler
          jsonPointers:
            - /status
