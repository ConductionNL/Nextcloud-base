---
# ApplicationSet that generates one Argo CD Application per platform component.
# Previously only existed live in-cluster (untracked drift); captured here so it
# is GitOps-managed. Each child app (platform-<component>) deploys one subpath of
# nextcloud-platform/platform/ and lives in the privileged nextcloud-platform-core
# project (it needs PriorityClass / ResourceQuota / LimitRange, which the tenant
# project forbids).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nextcloud-platform-components
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - component: redis
            path: nextcloud-platform/platform/redis
            wave: "-2"
          - component: pgbouncer
            path: nextcloud-platform/platform/pgbouncer
            wave: "-2"
          - component: externalsecrets
            path: nextcloud-platform/platform/externalsecrets
            wave: "-3"
          - component: policies
            path: nextcloud-platform/platform/policies
            wave: "-1"
          - component: postgres
            path: nextcloud-platform/platform/postgres
            wave: "-4"
  template:
    metadata:
      name: platform-{{component}}
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{wave}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        app.kubernetes.io/part-of: nextcloud-platform
        nextcloud.platform/component: '{{component}}'
    spec:
      project: nextcloud-platform-core
      source:
        repoURL: "https://github.com/ConductionNL/Nextcloud-base.git"
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: nextcloud-platform
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
