---
# Argo CD AppProject for Nextcloud Platform
# Defines permissions and resource boundaries for all Nextcloud tenants
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nextcloud-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Multi-tenant Nextcloud platform managed by GitOps"
  
  # Source repositories allowed for this project
  sourceRepos:
    # Primary host: GitHub (ConductionNL) — sinds de terugmigratie van 2026-07-15/17.
    - "git@github.com:ConductionNL/Nextcloud-base.git"
    - "https://github.com/ConductionNL/Nextcloud-base.git"
    - "https://github.com/conductionnl/Nextcloud-base.git"
    # Codeberg-URLs blijven toegestaan tot de tenant-omzetting (canary → waves)
    # af is; daarna opruimen. (Argo matcht sourceRepos letterlijk.)
    - "https://codeberg.org/conduction/Nextcloud-base.git"
    - "git@codeberg.org:conduction/Nextcloud-base.git"
    - "https://nextcloud.github.io/helm/"
    # WOO config / provisioner repo (target track: openwoo-provision ApplicationSet).
    # Argo matches sourceRepos literally — keep the exact case used in the AppSet.
    - "https://github.com/ConductionNL/openwoo-app-config.git"
    - "https://codeberg.org/Conduction/openwoo-app-config.git"

  # Destination clusters and namespaces
  destinations:
    # Platform components namespace
    - namespace: nextcloud-platform
      server: https://kubernetes.default.svc
    # OpenWoo provisioning/deployment control-plane
    - namespace: openwoo-platform
      server: https://kubernetes.default.svc
    # Backward compatible tenant namespaces
    - namespace: "nc-*"
      server: https://kubernetes.default.svc
    # Tenant namespaces by convention: <org>-<env>
    - namespace: "*-accept"
      server: https://kubernetes.default.svc
    - namespace: "*-test"
      server: https://kubernetes.default.svc
    - namespace: "*-prod"
      server: https://kubernetes.default.svc
    - namespace: "*-green"
      server: https://kubernetes.default.svc
    - namespace: "*-blue"
      server: https://kubernetes.default.svc
    - namespace: "*-demo"
      server: https://kubernetes.default.svc
  
  # Cluster resource whitelist
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  
  # Namespace resource blacklist (prevent dangerous resources)
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
  
  # Namespace resource whitelist
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: policy
      kind: "*"
    - group: autoscaling
      kind: "*"
    - group: external-secrets.io
      kind: "*"
    - group: cert-manager.io
      kind: "*"
    - group: monitoring.coreos.com
      kind: "*"
    - group: postgresql.cnpg.io
      kind: "*"
    # Gateway API: de HTTPRoute en de ReferenceGrant die charts/tenant-httproute
    # levert voor een tenant die naar de gedeelde Gateway migreert. Zonder deze
    # regel weigert het project die resources en faalt de HELE Application —
    # precies wat op 2026-08-18 aan de react-kant gebeurde, waar dezelfde regel
    # ontbrak en een ongerelateerde Ingress-wijziging erachter bleef steken.
    - group: gateway.networking.k8s.io
      kind: "*"
    # Namespaced RBAC. The cluster-scoped whitelist below already permits
    # ClusterRole and ClusterRoleBinding, so refusing the namespaced pair was
    # backwards: a Role is bound to one namespace and is strictly the narrower
    # of the two. Without this, an app that wants to grant its own pod a
    # permission inside its own namespace has no option but a cluster-wide
    # grant — the opposite of least privilege.
    # Added 2026-08-07: openwoo-app-config's control-plane needs `get`/`update`
    # on one ConfigMap in its own namespace and could not sync
    # ("resource rbac.authorization.k8s.io:Role is not permitted in project").
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  
  # Sync windows for controlled rollouts
  # All times are Amsterdam local time (Europe/Amsterdam handles CET/CEST automatically).
  #
  # Policy:
  #   - Platform changes (Redis, PgBouncer, ESO) MUST wait until after 17:00 — manualSync: false.
  #     Die apps zitten in AppProject nextcloud-platform-core; het window staat daar, op
  #     "platform-*", en werkt.
  #   - Tenant apps (nc-*) have NO sync window: tenant changes mogen altijd door, ook tijdens
  #     kantooruren. Discipline voor shared-values fan-out ligt bij de committer
  #     (zie governance docs + /change-guard skill), niet bij Argo.
  #
  # Daarom heeft dit project bewust GEEN syncWindows. Hier stond een deny-window op
  # applications: ["nextcloud-platform"] — een applicatie met die naam bestaat niet (de 76
  # tenant-apps heten nc-<tenant>), dus het matchte niets en blokkeerde niets. Verwijderd omdat
  # het dekking suggereerde die er niet is; het weghalen verandert geen uitrolgedrag.
  #
  # Wil je tenant-apps tóch gaan gaten, dan is dat een bewuste omkering van de policy hierboven
  # en heb je manualSync: true nodig, anders kun je tussen 07:00 en 17:00 geen nieuwe tenant
  # meer live zetten.

  # Roles for project access
  roles:
    - name: platform-admin
      description: "Full access to Nextcloud platform"
      policies:
        - p, proj:nextcloud-platform:platform-admin, applications, *, nextcloud-platform/*, allow
        - p, proj:nextcloud-platform:platform-admin, repositories, *, nextcloud-platform/*, allow
      groups:
        - platform-admins
    
    - name: tenant-viewer
      description: "Read-only access to tenant applications"
      policies:
        - p, proj:nextcloud-platform:tenant-viewer, applications, get, nextcloud-platform/*, allow
        - p, proj:nextcloud-platform:tenant-viewer, applications, sync, nextcloud-platform/*, deny
      groups:
        - tenant-viewers
    
    - name: tenant-operator
      description: "Sync access to specific tenant applications"
      policies:
        - p, proj:nextcloud-platform:tenant-operator, applications, get, nextcloud-platform/*, allow
        - p, proj:nextcloud-platform:tenant-operator, applications, sync, nextcloud-platform/*, allow
        - p, proj:nextcloud-platform:tenant-operator, applications, action/*, nextcloud-platform/*, allow
      groups:
        - tenant-operators

---
# Namespace for platform components
apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud-platform
  labels:
    app.kubernetes.io/part-of: nextcloud-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

