---
# Argo CD AppProject for Nextcloud Platform CORE components
# Separate, more-privileged project for platform infrastructure apps
# (the bundled `nextcloud-platform` app + the `platform-*` apps generated by
# the `nextcloud-platform-components` ApplicationSet).
#
# Why a separate project: the `nextcloud-platform` project (which holds all
# tenant apps) blacklists ResourceQuota/LimitRange and does not whitelist
# PriorityClass — a deliberate tenant guardrail. The platform `policies` app
# legitimately needs to create exactly those cluster/namespace guardrails, so
# it lives here where they are permitted. Tenants stay restricted.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nextcloud-platform-core
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Privileged project for Nextcloud platform-core infrastructure apps"

  # Source repositories allowed for this project
  sourceRepos:
    # Primary host: Codeberg (Forgejo). GitHub org is shadowbanned; Codeberg is now canonical.
    - "https://codeberg.org/conduction/Nextcloud-base.git"
    - "git@codeberg.org:conduction/Nextcloud-base.git"
    # GitHub URLs kept during transition for rollback (Argo matches literally)
    - "git@github.com:ConductionNL/Nextcloud-base.git"
    - "https://github.com/ConductionNL/Nextcloud-base.git"
    - "https://github.com/conductionnl/Nextcloud-base.git"
    - "https://nextcloud.github.io/helm/"

  # Destination clusters and namespaces (copied from nextcloud-platform for parity)
  destinations:
    - namespace: nextcloud-platform
      server: https://kubernetes.default.svc
    - namespace: "nc-*"
      server: https://kubernetes.default.svc
    - namespace: "*-accept"
      server: https://kubernetes.default.svc
    - namespace: "*-test"
      server: https://kubernetes.default.svc
    - namespace: "*-prod"
      server: https://kubernetes.default.svc
    - namespace: "*-green"
      server: https://kubernetes.default.svc
    - namespace: "*-blue"
      server: https://kubernetes.default.svc
    - namespace: "*-demo"
      server: https://kubernetes.default.svc

  # Cluster resource whitelist — adds PriorityClass on top of the tenant project
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: scheduling.k8s.io
      kind: PriorityClass
    # ESO consumers that are cluster-scoped (the operator itself lives in cluster-infra)
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: generators.external-secrets.io
      kind: ClusterGenerator

  # No namespaceResourceBlacklist here: ResourceQuota/LimitRange ARE permitted,
  # because the platform `policies` app must manage them. The tenant guardrail
  # against these lives in the `nextcloud-platform` project, not here.

  # Namespace resource whitelist (same set as the tenant project)
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: policy
      kind: "*"
    - group: autoscaling
      kind: "*"
    - group: rbac.authorization.k8s.io      # external-secrets-reader Role/RoleBinding
      kind: "*"
    - group: external-secrets.io
      kind: "*"
    - group: cert-manager.io
      kind: "*"
    - group: monitoring.coreos.com
      kind: "*"
    - group: postgresql.cnpg.io
      kind: "*"

  # Sync windows for controlled rollouts
  # All times are Amsterdam local time (Europe/Amsterdam handles CET/CEST automatically).
  # Platform-core changes are denied 07:00-17:00 Mon-Fri (manualSync disabled too).
  # This now also covers the platform-* component apps, which previously had no window.
  syncWindows:
    - kind: deny
      schedule: "0 7 * * 1-5"
      duration: 10h
      timeZone: Europe/Amsterdam
      applications:
        - "nextcloud-platform"
        - "platform-*"
      manualSync: false

  # Roles for project access
  roles:
    - name: platform-admin
      description: "Full access to Nextcloud platform-core"
      policies:
        - p, proj:nextcloud-platform-core:platform-admin, applications, *, nextcloud-platform-core/*, allow
        - p, proj:nextcloud-platform-core:platform-admin, repositories, *, nextcloud-platform-core/*, allow
      groups:
        - platform-admins
