---
# Apex-host (twee labels) zonder tenant.extraHostnamesAllowApex: geweigerd.
tenant:
  name: voorbeeld-prod
  environment: prod
  wave: "1"
  dbType: postgres
  hostname: cloud.voorbeeld.nl
  hostnameOverride: true
  apps:
    enabled:
      - openregister
  extraHostnames:
    - voorbeeld.nl
    - www.voorbeeld.nl
