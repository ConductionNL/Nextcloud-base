---
# Apex-host met de opt-in: geldig. De render-check (render-extra-hosts.sh) gebruikt dit bestand ook.
tenant:
  name: voorbeeld-prod
  environment: prod
  wave: "1"
  dbType: postgres
  hostname: cloud.voorbeeld.nl
  hostnameOverride: true
  apps:
    enabled:
      - openregister
  extraHostnamesAllowApex: true
  extraHostnames:
    - voorbeeld.nl
    - www.voorbeeld.nl
