---
# Leunt op values/tenants/tenant-dinkelland-prod.yaml: breekt als de hosts van dinkelland veranderen.
tenant:
  name: voorbeeld-prod
  environment: prod
  wave: "1"
  dbType: postgres
  hostname: cloud.voorbeeld.nl
  hostnameOverride: true
  apps:
    enabled:
      - openregister
  extraHostnames:
    - open.dinkelland.nl
