---
# Database profile: PostgreSQL (in-cluster)
# Enable with tenant.dbType: postgres
# Uses a custom Postgres image with extensions.

mariadb:
  enabled: false

postgresql:
  enabled: true
  image:
    registry: ghcr.io
    repository: conductionnl/nextcloud-images
    tag: postgres16-ext-sha-8abef67
    # Pinned to the image digest for immutability/auditability.
    # When digest is set the Bitnami chart pulls repository@digest; tag stays for readability.
    digest: sha256:7478927e1ad48c28d491a2589683fe6cb7a4f8468cece491915990e988b4f8c4
    pullPolicy: IfNotPresent
  auth:
    database: nextcloud
    username: nextcloud
    existingSecret: nextcloud-secrets
    secretKeys:
      # Keep admin password separate from the Nextcloud DB user password.
      # These keys are created by scripts/create-tenant-secret.sh --postgres
      adminPasswordKey: postgres-password
      userPasswordKey: db-password
  primary:
    # -------------------------------------------------------------------------
    # Probes — zelfde reden als bij values/db/mariadb.yaml
    # -------------------------------------------------------------------------
    # Zonder startupProbe is het opstartbudget wat liveness toestaat, en dat was
    # hier `initialDelaySeconds: 30` + 6×10s = 90 seconden. Krapper dan MariaDB had
    # (150s), en dat budget bleek op 2026-08-04 al te kort: twee MariaDB-tenants
    # kwamen in een oneindige CrashLoopBackOff omdat de kubelet de container
    # afschoot voordat de start klaar was.
    #
    # PostgreSQL doet bij een onreine stop WAL-recovery voordat hij connecties
    # opent. Hoe groter de database, hoe reëler dat dit over 90 seconden gaat; wordt
    # hij daar middenin afgeschoten, dan begint recovery elke ronde opnieuw en komt
    # hij nooit klaar. Data raakt niet corrupt — PostgreSQL is crash-safe — maar de
    # tenant blijft down.
    #
    # Budget hieronder: 30s + (60 × 10s) = 10 minuten, gelijk aan MariaDB en aan de
    # platform-standaard voor de Nextcloud-container.
    startupProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
      successThreshold: 1

    # Pas scherp zodra de startupProbe geslaagd is. Dat is strakker dan het
    # chart-budget van 90s en merkt een dode database dus sneller op.
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1

    initdb:
      scripts:
        01-enable-extensions.sql: |
          CREATE EXTENSION IF NOT EXISTS plpgsql;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS btree_gin;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          CREATE EXTENSION IF NOT EXISTS vector;

internalDatabase:
  enabled: false

externalDatabase:
  enabled: false
