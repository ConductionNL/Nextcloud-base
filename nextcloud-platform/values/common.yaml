---
# Common values for all Nextcloud tenants
# This file is merged with env/*.yaml and tenants/*.yaml

# Helm chart configuration
chart:
  # Pin the Nextcloud Helm chart version for reproducibility
  # Update this to upgrade all tenants
  version: "8.9.0"

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
# Select with `tenant.dbType` in the tenant file:
#   - "postgres"  : In-cluster PostgreSQL per tenant (DEFAULT, use this)
#   - "mariadb"   : In-cluster MariaDB per tenant — LEGACY, being phased out
#   - "external"  : Shared PostgreSQL with PgBouncer — not usable yet,
#                   see docs/CNPG-MIGRATIE.md
#
# `tenant.dbType` is a required field (it is in REQUIRED_FIELDS of
# scripts/validate-values.sh), so no tenant ever inherits an engine silently —
# omit it and CI fails. All 77 tenant files declare it today.
#
# Where the default actually lives: the ApplicationSet
# (argo/applicationsets/nextcloud-tenants.yaml) layers
# `values/db/{{ default "postgres" .tenant.dbType }}.yaml` AFTER this file, and
# each db/ profile sets all four enabled-flags explicitly. So the flags below are
# always overridden for a real tenant — they are documentation, not the switch.
# =============================================================================

database:
  # Vestigial: nothing reads .Values.database.type. Kept in step with the
  # direction so it does not contradict the ApplicationSet default.
  # Options: postgres, mariadb (legacy), external
  type: postgres

# -----------------------------------------------------------------------------
# Option 1: MariaDB — LEGACY, being phased out
# -----------------------------------------------------------------------------
# Do not choose this for a new tenant; see docs/DATABASE.md. Kept because 22
# tenants still run on it. Note these pods keep tight limits (below) while
# measured MariaDB memory p90 is 291Mi — accepted for the phase-out period.
#
# De opstartcyclus van de bitnami-image kent bovendien een deadlock-risico dat op
# 2026-08-04 twee productie-tenants platlegde. values/db/mariadb.yaml dekt dat af
# met een startupProbe en innodb_buffer_pool_load_at_startup=0; docs/DEBUGGING.md
# beschrijft hoe je het herkent.

mariadb:
  enabled: false  # overridden to true by values/db/mariadb.yaml
  auth:
    database: nextcloud
    username: nextcloud
    # Password from existingSecret (created per-tenant as nextcloud-secrets)
    existingSecret: nextcloud-secrets
    secretKeys:
      mariadb-root-password: mariadb-root-password
      mariadb-password: mariadb-password
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""  # Use default, or set to cephfs
    resources:
      limits:
        cpu: 500m
        memory: 512Mi

# -----------------------------------------------------------------------------
# Option 2: PostgreSQL in-cluster — DEFAULT for new tenants
# -----------------------------------------------------------------------------
# Each tenant gets their own PostgreSQL pod.

postgresql:
  enabled: true  # overridden to false by values/db/mariadb.yaml and db/external.yaml
  auth:
    database: nextcloud
    username: nextcloud
    # Password from existingSecret (created per-tenant as nextcloud-secrets)
    existingSecret: nextcloud-secrets
    secretKeys:
      adminPasswordKey: db-password
      userPasswordKey: db-password
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources:
      limits:
        cpu: 500m
        memory: 512Mi

# -----------------------------------------------------------------------------
# Option 3: External PostgreSQL (production recommended)
# -----------------------------------------------------------------------------
# Shared external PostgreSQL with PgBouncer connection pooling
# Good for: production, multi-tenant efficiency, managed databases
# Requires: postgres-admin secret for auto-provisioning

internalDatabase:
  enabled: false

externalDatabase:
  enabled: false  # Set to true for external PostgreSQL
  type: postgresql
  host: pgbouncer.nextcloud-platform.svc.cluster.local
  port: 5432
  # database: nextcloud_<tenant>  # Set per tenant
  existingSecret:
    enabled: true
    secretName: nextcloud-secrets
    usernameKey: db-username
    passwordKey: db-password

# =============================================================================
# END DATABASE CONFIGURATION
# =============================================================================

# Global image settings
#
# pullPolicy: IfNotPresent sinds 2026-08-05. Stond op Always, wat elke
# pod-start een registry-round-trip maakte. Die tellen mee tegen de
# anonieme Docker Hub-limiet (100 pulls/6u/IP), en sinds de Docker
# Pro-credential is verlopen pullt de fleet weer anoniem — zie
# cluster-config/ROADMAP.md. Veilig omdat de tag hieronder vast is
# gepind, niet zwevend: een nieuwe versie is een tag-wijziging in dit
# bestand, en die triggert de pull vanzelf.
#
# LET OP bij terugzetten naar een zwevende tag (`32-fpm`, `latest`):
# met IfNotPresent pikt een node die de tag al gecachet heeft nieuwe
# pushes niet meer op. Zwevende tag en IfNotPresent gaan niet samen.
#
# De fasering zit niet in dit bestand maar in de refs: wave-0 volgt main
# en krijgt dit bij de merge, de andere 74 volgen `release` en krijgen
# het pas bij promotie. Zie CLAUDE.md, sectie Sync Windows.
image:
  repository: nextcloud
  tag: "32.0.13-fpm"
  pullPolicy: IfNotPresent

# Replica count (can be overridden per env/tenant)
replicaCount: 1

# Nextcloud configuration
nextcloud:
  # Host is set per-tenant
  # host: tenant.example.com
  
  # Priority class (disabled - not available in cluster)
  priorityClassName: ""
  
  # Pod security context - www-data is UID/GID 33 in official Nextcloud image
  podSecurityContext:
    fsGroup: 33
    fsGroupChangePolicy: "OnRootMismatch"

  # Fix volume permissions for RWX Cinder volumes.
  # The Cinder CSI driver uses fsGroupPolicy: ReadWriteOnceWithFSType, which means
  # Kubernetes skips the fsGroup chown for ReadWriteMany volumes. This initContainer
  # does it manually. The stat check makes it a no-op when permissions are already
  # correct (fast on already-initialized RWO volumes).
  extraInitContainers:
    - name: volume-permissions
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          if [ "$(stat -c '%u' /var/www/html)" != "33" ]; then
            echo "Fixing /var/www/html ownership (owned by $(stat -c '%u:%g' /var/www/html), expected 33:33)"
            chown -R 33:33 /var/www/html
            echo "Done"
          else
            echo "/var/www/html already owned by www-data (33), skipping"
          fi
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: nextcloud-main
          mountPath: /var/www/html
  
  # Existing secret for credentials (created by ExternalSecret)
  existingSecret:
    enabled: true
    secretName: nextcloud-secrets
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
    smtpUsernameKey: smtp-username
    smtpPasswordKey: smtp-password
    smtpHostKey: smtp-host
  
  # Update strategy
  update: 0
  
  # Data directory (inside container)
  datadir: /var/www/html/data
  
  # PHP configuration
  phpConfigs:
    www.conf: |
      [www]
      user = www-data
      group = www-data
      listen = 127.0.0.1:9000
      
      pm = dynamic
      pm.max_children = 50
      pm.start_servers = 5
      pm.min_spare_servers = 5
      pm.max_spare_servers = 35
      pm.max_requests = 500
      
      ; PHP-FPM status endpoint (for monitoring)
      pm.status_path = /fpm-status
      pm.status_listen = 127.0.0.1:9001
      ping.path = /fpm-ping
      ping.response = pong
      
      ; PHP settings
      php_admin_value[memory_limit] = 2048M
      php_admin_value[upload_max_filesize] = 16G
      php_admin_value[post_max_size] = 16G
      php_admin_value[max_execution_time] = 3600
      php_admin_value[max_input_time] = 3600
      php_admin_value[output_buffering] = Off
  
  # DISABLE ALL default configs - let Nextcloud manage config.php itself
  # These mount as read-only ConfigMaps and block Nextcloud from writing!
  defaultConfigs:
    .htaccess: false
    redis.config.php: false
    apache-pretty-urls.config.php: false
    apcu.config.php: false
    apps.config.php: false
    autoconfig.php: false
    smtp.config.php: false
    logging.config.php: false
  
  # Custom Nextcloud configs
  configs:
    proxy.config.php: |
      <?php
      $CONFIG = array (
        // Trust proxies in cluster network ranges
        'trusted_proxies' => array(
          0 => '127.0.0.1',
          1 => '100.96.0.0/16',   // Kubernetes pod network
          2 => '10.0.0.0/8',       // Internal services
          3 => '192.168.0.0/16',   // Private networks
        ),
        'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
        'overwriteprotocol' => 'https',
        
        // Session settings
        'session_lifetime' => 28800,      // 8 hours
        'session_idle_timeout' => 7200,   // 2 hours idle
        'session_keepalive' => false,
        // Remember-me cookie matches session_lifetime so "stay logged in"
        // cannot outlive the 8h session. MUST NOT be lower than
        // session_lifetime (Nextcloud terminates the session early otherwise).
        'remember_login_cookie_lifetime' => 28800,  // 8 hours, == session_lifetime
        
        // UI settings
        'simpleSignUpLink.shown' => false,
        
        // Cleanup settings
        'trashbin_retention_obligation' => 'auto, 1',
        'versions_retention_obligation' => 'auto, 1',
        'activity_expire_days' => 2,
        
        // Kubernetes: skip permission check (handled by fsGroup)
        'check_data_directory_permissions' => false,
        
        // Maintenance window: 3:00 - 5:00 UTC (4:00 - 6:00 CET)
        'maintenance_window_start' => 3,
        
        // Default phone region for profile validation
        'default_phone_region' => 'NL',
        'default_language' => 'nl',
        'default_locale'   => 'nl_NL',
      );
    
    redis.config.php: |
      <?php
      // Redis config that works for BOTH:
      // - Platform Redis (no auth): REDIS_HOST not set → uses default
      // - Per-tenant Redis (with auth): REDIS_HOST set by Helm chart
      $redisHost = getenv('REDIS_HOST') ?: 'redis.nextcloud-platform.svc.cluster.local';
      $redisPassword = getenv('REDIS_HOST_PASSWORD') ?: null;
      
      $CONFIG = array (
        'memcache.local' => '\\OC\\Memcache\\APCu',
        'memcache.distributed' => '\\OC\\Memcache\\Redis',
        'memcache.locking' => '\\OC\\Memcache\\Redis',
        'redis' => array(
          'host' => $redisHost,
          'port' => 6379,
          'timeout' => 1.5,
          'password' => $redisPassword,
        ),
        'filelocking.enabled' => true,
      );
    
    # Apps paths configuration - enables custom_apps directory for pinned versions
    apps.config.php: |
      <?php
      $CONFIG = array (
        'apps_paths' => array(
          // Standard apps directory (read-only, bundled with image)
          array(
            'path' => '/var/www/html/apps',
            'url' => '/apps',
            'writable' => false,
          ),
          // Custom apps directory (writable, for pinned versions)
          array(
            'path' => '/var/www/html/custom_apps',
            'url' => '/custom_apps',
            'writable' => true,
          ),
        ),
      );

  # ===========================================================================
  # CONDUCTION APPS INSTALLER (GitOps)
  # ===========================================================================
  # Nextcloud Helm chart mounts these scripts into:
  #   /docker-entrypoint-hooks.d/<hook-name>/helm.sh
  #
  # before-starting and post-installation run the SAME script (YAML anchor
  # below), so the two can no longer drift apart. The script finds out which
  # hook it is from its own path, for the log only.
  #
  # Idempotent via a state file: it only does work when the app list or a pin
  # changed since the last successful run.
  #
  # Env (set by argo/applicationsets/nextcloud-tenants.yaml):
  #   CONDUCTION_APPS           app ids to install, space separated
  #   CONDUCTION_APP_VERSIONS   pins for any app, "id=version id=version"
  #                             (from tenant.apps.versions; only set when a
  #                             tenant pins something)
  #   OPENCATALOGI_VERSION, OPENCONNECTOR_VERSION, OPENREGISTER_VERSION
  #                             legacy pins, still honoured and still win
  #
  # A pinned app comes from
  #   https://github.com/ConductionNL/<id>/releases/download/v<ver>/<id>-<ver>.tar.gz
  # and is verified before it replaces anything: the published .sha256 when the
  # release has one, a single top folder named <id>, no absolute or '..'
  # paths, and <id> in appinfo/info.xml. Afterwards Nextcloud must report the
  # pinned version: after `occ app:enable`, or after one `occ upgrade` when
  # the app was already enabled (Nextcloud 32 does not upgrade an enabled app
  # on app:enable). Old repo names redirect on GitHub, so
  # the app id doubles as the repo name. A failed pin is logged as ERROR (also
  # on stderr, so it shows in the container log), leaves the app as it was,
  # and keeps the state file unwritten so the next start retries.
  #
  # Tested with fixtures: nextcloud-platform/tests/run-hook-tests.sh
  # Log: /var/www/html/data/conduction-apps.log
  hooks:
    # Runs on every container start; exits fast once the state matches.
    # This is the most reliable way to ensure apps are present for existing tenants too.
    before-starting: &conduction-apps-hook |
      #!/bin/bash
      set -o pipefail

      # CONDUCTION_NC_ROOT exists for the fixture tests; in the pod it is unset.
      NC_ROOT="${CONDUCTION_NC_ROOT:-/var/www/html}"
      LOG="$NC_ROOT/data/conduction-apps.log"
      STATE_FILE="$NC_ROOT/data/.conduction-apps-state"
      PHASE="$(basename "$(dirname "$0")")"
      LEGACY_APPS="opencatalogi openconnector openregister"
      ID_RE='^[a-z][a-z0-9_]*$'
      VER_RE='^[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$'
      FAILED=0
      # Pinned apps whose code was replaced while they were already enabled;
      # they need `occ upgrade` before Nextcloud reports the new version.
      NEEDS_UPGRADE=()

      log() { echo "$(date '+%Y-%m-%d %H:%M:%S') $1" >> "$LOG" 2>&1; }
      # Errors go to the log AND stderr, and block writing the state file.
      fail() { log "ERROR: $1"; echo "conduction-apps ERROR: $1" >&2; FAILED=1; }

      if [ "${CONDUCTION_APPS_ENABLED:-true}" != "true" ]; then log "Conduction apps disabled (skipping)"; exit 0; fi
      if [ ! -f "$NC_ROOT/config/config.php" ]; then log "Nextcloud not configured yet (skipping, $PHASE)"; exit 0; fi

      log "=== Conduction Apps Bootstrap Started ($PHASE) ==="

      APPS="${CONDUCTION_APPS:-opencatalogi openconnector openregister}"
      if [ -z "$APPS" ]; then
        log "CONDUCTION_APPS is empty; skipping"
        exit 0
      fi

      # Collect pins: generic list first, legacy env vars win for their app.
      declare -A PIN=()
      # Apps whose pin is unreadable: left alone, never silently swapped for
      # the app store version.
      declare -A BAD_PIN=()
      read -r -a PIN_TOKENS <<< "${CONDUCTION_APP_VERSIONS-}"
      for tok in "${PIN_TOKENS[@]}"; do
        pin_id="${tok%%=*}"
        pin_ver="${tok#*=}"
        if [ "$pin_id" = "$tok" ] || ! [[ "$pin_id" =~ $ID_RE ]] || ! [[ "$pin_ver" =~ $VER_RE ]]; then
          fail "invalid pin '$tok' in CONDUCTION_APP_VERSIONS (expected <app-id>=<version>, no leading v)"
          if [ -n "$pin_id" ]; then BAD_PIN[$pin_id]=1; fi
          continue
        fi
        PIN[$pin_id]="$pin_ver"
      done
      for pair in opencatalogi:OPENCATALOGI_VERSION openconnector:OPENCONNECTOR_VERSION openregister:OPENREGISTER_VERSION; do
        pin_id="${pair%%:*}"
        legacy_var="${pair#*:}"
        legacy_ver="${!legacy_var-}"
        [ -z "$legacy_ver" ] && continue
        if [ -n "${PIN[$pin_id]-}" ] && [ "${PIN[$pin_id]}" != "$legacy_ver" ]; then
          log "WARNING: $pin_id pinned twice (${PIN[$pin_id]} and $legacy_ver); the legacy env var wins"
        fi
        PIN[$pin_id]="$legacy_ver"
      done

      # State key. For the three legacy apps it is byte for byte the old key,
      # so a tenant that only uses those pins does not reinstall after this
      # hook changes. Any other pin is appended, sorted, so changing it
      # reruns the bootstrap.
      DESIRED_STATE="APPS=${APPS};OPENCATALOGI_VERSION=${PIN[opencatalogi]-};OPENCONNECTOR_VERSION=${PIN[openconnector]-};OPENREGISTER_VERSION=${PIN[openregister]-}"
      EXTRA_PINS=""
      for pin_id in $(printf '%s\n' "${!PIN[@]}" | sort); do
        case " $LEGACY_APPS " in *" $pin_id "*) continue ;; esac
        EXTRA_PINS="${EXTRA_PINS:+$EXTRA_PINS,}$pin_id=${PIN[$pin_id]}"
        case " $APPS " in
          *" $pin_id "*) ;;
          *) log "WARNING: $pin_id is pinned but not in CONDUCTION_APPS; pin ignored" ;;
        esac
      done
      if [ -n "$EXTRA_PINS" ]; then DESIRED_STATE="${DESIRED_STATE};PINS=${EXTRA_PINS}"; fi

      CURRENT_STATE="$(cat "$STATE_FILE" 2>/dev/null || true)"
      if [ "$FAILED" -eq 0 ] && [ "$CURRENT_STATE" = "$DESIRED_STATE" ]; then
        log "Conduction apps already in desired state (skip)"
        exit 0
      fi

      # Download, verify and move one pinned app into custom_apps.
      # Returns non-zero (after fail) without touching the installed app.
      fetch_pinned() {
        local APP_NAME=$1 VERSION=$2
        local ASSET="$APP_NAME-$VERSION.tar.gz"
        local URL="https://github.com/ConductionNL/$APP_NAME/releases/download/v$VERSION/$ASSET"
        local WORK STAGE CODE EXPECTED ACTUAL LISTING TOPS XML_ID XML_VER

        if ! [[ "$APP_NAME" =~ $ID_RE ]] || ! [[ "$VERSION" =~ $VER_RE ]]; then
          fail "$APP_NAME: invalid pin '$VERSION' (expected e.g. 0.7.12 or 0.2.10-unstable.4, no leading v)"
          return 1
        fi

        log "Installing $APP_NAME v$VERSION (pinned)..."
        log "Download URL: $URL"
        WORK="$(mktemp -d "${TMPDIR:-/tmp}/conduction-$APP_NAME.XXXXXX")" || { fail "$APP_NAME: mktemp failed"; return 1; }

        if ! curl -fsSL --retry 3 --retry-delay 5 "$URL" -o "$WORK/$ASSET" 2>>"$LOG"; then
          fail "$APP_NAME v$VERSION: GitHub download failed for $URL (app left as it was)"
          rm -rf "$WORK"; return 1
        fi

        CODE="$(curl -sSL --retry 3 --retry-delay 5 -o "$WORK/$ASSET.sha256" -w '%{http_code}' "$URL.sha256" 2>>"$LOG")"
        if [ "$CODE" = "200" ]; then
          EXPECTED="$(awk '{print $1; exit}' "$WORK/$ASSET.sha256")"
          ACTUAL="$(sha256sum "$WORK/$ASSET" | awk '{print $1}')"
          if ! [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || [ "$EXPECTED" != "$ACTUAL" ]; then
            fail "$APP_NAME v$VERSION: sha256 mismatch (published '$EXPECTED', got '$ACTUAL')"
            rm -rf "$WORK"; return 1
          fi
          log "$APP_NAME v$VERSION: sha256 verified"
        elif [ "$CODE" = "404" ]; then
          log "WARNING: $APP_NAME v$VERSION: release publishes no .sha256; checking structure only"
        else
          fail "$APP_NAME v$VERSION: could not fetch $URL.sha256 (HTTP '$CODE')"
          rm -rf "$WORK"; return 1
        fi

        if ! LISTING="$(tar -tzf "$WORK/$ASSET" 2>>"$LOG")"; then
          fail "$APP_NAME v$VERSION: $ASSET is not a readable tar.gz"
          rm -rf "$WORK"; return 1
        fi
        if printf '%s\n' "$LISTING" | grep -qE '(^/|(^|/)[.][.](/|$))'; then
          fail "$APP_NAME v$VERSION: $ASSET contains absolute or '..' paths"
          rm -rf "$WORK"; return 1
        fi
        TOPS="$(printf '%s\n' "$LISTING" | sed -e 's#^\./##' -e '/^$/d' | cut -d/ -f1 | sort -u | tr '\n' ' ')"
        if [ "$TOPS" != "$APP_NAME " ]; then
          fail "$APP_NAME v$VERSION: top folder of $ASSET is '${TOPS% }', expected '$APP_NAME'"
          rm -rf "$WORK"; return 1
        fi

        # Stage on the same filesystem as custom_apps, so the final step is a rename.
        # A run killed mid-install (startupProbe) leaves its staging dir; clear those first.
        mkdir -p "$NC_ROOT/custom_apps"
        rm -rf "$NC_ROOT/custom_apps/.conduction-staging-$APP_NAME."*
        STAGE="$NC_ROOT/custom_apps/.conduction-staging-$APP_NAME.$$"
        mkdir -p "$STAGE"
        if ! tar -xzf "$WORK/$ASSET" -C "$STAGE" 2>>"$LOG"; then
          fail "$APP_NAME v$VERSION: extracting $ASSET failed"
          rm -rf "$WORK" "$STAGE"; return 1
        fi
        rm -rf "$WORK"

        XML_ID="$(grep -o '<id>[^<]*</id>' "$STAGE/$APP_NAME/appinfo/info.xml" 2>/dev/null | head -1 | sed -e 's#<id>##' -e 's#</id>##')"
        if [ "$XML_ID" != "$APP_NAME" ]; then
          fail "$APP_NAME v$VERSION: appinfo/info.xml has id '$XML_ID', expected '$APP_NAME'"
          rm -rf "$STAGE"; return 1
        fi
        XML_VER="$(grep -o '<version>[^<]*</version>' "$STAGE/$APP_NAME/appinfo/info.xml" | head -1 | sed -e 's#<version>##' -e 's#</version>##')"
        if [ "$XML_VER" != "$VERSION" ]; then
          log "WARNING: $APP_NAME: info.xml says version '$XML_VER', pin is '$VERSION'"
        fi

        if [ -d "$NC_ROOT/apps/$APP_NAME" ]; then
          log "Removing bundled $APP_NAME from /apps/ to use pinned version"
          rm -rf "$NC_ROOT/apps/$APP_NAME"
        fi
        rm -rf "$NC_ROOT/custom_apps/$APP_NAME"
        if ! mv "$STAGE/$APP_NAME" "$NC_ROOT/custom_apps/$APP_NAME"; then
          fail "$APP_NAME v$VERSION: moving into custom_apps failed"
          rm -rf "$STAGE"; return 1
        fi
        rm -rf "$STAGE"
        chown -R www-data:www-data "$NC_ROOT/custom_apps/$APP_NAME" 2>>"$LOG" || true
        log "$APP_NAME v$VERSION installed to custom_apps"
        return 0
      }

      installed_version() {
        php occ app:list 2>/dev/null | grep -- "- $1:" | sed 's/.*: //'
      }

      # check_pinned_version <id> <pin> <when>: Nextcloud must report the pin.
      check_pinned_version() {
        local INSTALLED_VER
        INSTALLED_VER="$(installed_version "$1")"
        if [ "$INSTALLED_VER" != "$2" ]; then
          fail "$1: pinned $2 but Nextcloud reports '$INSTALLED_VER' $3"
          return 1
        fi
        log "$1 enabled (version: $INSTALLED_VER)"
      }

      install_app() {
        local APP_NAME=$1 VERSION="${PIN[$1]-}" INSTALLED_VER ENABLE_OUT

        if [ -z "$VERSION" ] && [ -n "${BAD_PIN[$APP_NAME]-}" ]; then
          log "Skipping $APP_NAME: its pin is invalid (see ERROR above)"
          return 0
        fi

        if [ -n "$VERSION" ]; then
          fetch_pinned "$APP_NAME" "$VERSION" || return 0
          ENABLE_OUT="$(php occ app:enable "$APP_NAME" 2>>"$LOG")" || true
          if [ -n "$ENABLE_OUT" ]; then log "occ app:enable $APP_NAME: $ENABLE_OUT"; fi
          if [ -d "$NC_ROOT/apps/$APP_NAME" ]; then
            log "Removing /apps/$APP_NAME (prefer custom_apps pinned version)"
            rm -rf "$NC_ROOT/apps/$APP_NAME"
            php occ app:enable "$APP_NAME" 2>>"$LOG" || true
          fi
          # Nextcloud 32 does nothing for an app that is already enabled
          # ("<id> already enabled"), and app:list keeps showing the version
          # stored at install time. Such an app is checked after the one
          # `occ upgrade` below; a freshly enabled app is checked now, because
          # enabling stored the info.xml version.
          case "$ENABLE_OUT" in
            *"$APP_NAME already enabled"*) NEEDS_UPGRADE+=("$APP_NAME"); return 0 ;;
          esac
          check_pinned_version "$APP_NAME" "$VERSION" "after enable" || true
          return 0
        fi

        case " $LEGACY_APPS " in
          *" $APP_NAME "*)
            if php occ app:list 2>/dev/null | grep -q -- "- $APP_NAME:"; then
              log "$APP_NAME already installed"
              return 0
            fi
            log "Installing $APP_NAME (latest from app store)..."
            php occ app:install "$APP_NAME" 2>>"$LOG" || true
            php occ app:enable "$APP_NAME" 2>>"$LOG" || true
            INSTALLED_VER="$(installed_version "$APP_NAME")"
            log "$APP_NAME enabled (version: $INSTALLED_VER)"
            ;;
          *)
            log "Installing $APP_NAME (app store, not pinned)..."
            php occ app:install "$APP_NAME" 2>>"$LOG" || true
            php occ app:enable "$APP_NAME" 2>>"$LOG" || true
            ;;
        esac
      }

      for app in $APPS; do
        install_app "$app"
      done

      # One `occ upgrade` per run, after every pin is in place: it upgrades all
      # enabled apps whose code is newer than the stored version in one go (and
      # holds maintenance mode while it does), so running it per app would only
      # repeat that. Only after it does app:list show the new version, so the
      # version check for these apps comes last.
      if [ "${#NEEDS_UPGRADE[@]}" -gt 0 ]; then
        log "Running occ upgrade for replaced apps that were already enabled: ${NEEDS_UPGRADE[*]}"
        if ! php occ upgrade >>"$LOG" 2>&1; then
          fail "occ upgrade failed after replacing ${NEEDS_UPGRADE[*]} (see $LOG)"
        fi
        for app in "${NEEDS_UPGRADE[@]}"; do
          check_pinned_version "$app" "${PIN[$app]}" "after occ upgrade" || true
        done
      fi

      log "Running database maintenance..."
      php occ db:add-missing-indices 2>>"$LOG" || true
      php occ maintenance:repair --include-expensive 2>>"$LOG" || true
      log "Database maintenance complete"

      if [ "$FAILED" -ne 0 ]; then
        log "=== Conduction Apps Bootstrap INCOMPLETE: state not written, next start retries ==="
        echo "conduction-apps: bootstrap incomplete, see $LOG" >&2
        exit 0
      fi

      echo "$DESIRED_STATE" > "$STATE_FILE"
      log "=== Conduction Apps Bootstrap Complete ==="

    # Same script as before-starting (anchor), run once after a fresh install.
    post-installation: *conduction-apps-hook
    # Also run on upgrades; marker prevents re-running.
    post-upgrade: |
      #!/bin/bash
      set -euo pipefail
      LOG="/var/www/html/data/conduction-apps.log"
      echo "$(date '+%Y-%m-%d %H:%M:%S') post-upgrade hook triggered (see marker)" >> "$LOG" 2>&1
# Nginx configuration (sidecar)
nginx:
  enabled: true
  image:
    repository: nginx
    tag: "alpine"
    pullPolicy: IfNotPresent
  
  config:
    default: |
      upstream php-handler {
          server 127.0.0.1:9000;
      }
      
      server {
          listen 8080;
          
          add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;
          
          client_max_body_size 16G;
          client_body_timeout 1800s;
          fastcgi_buffers 64 4K;
          fastcgi_read_timeout 1800s;
          fastcgi_send_timeout 1800s;
          proxy_read_timeout 1800s;
          proxy_send_timeout 1800s;
          send_timeout 1800s;
          
          gzip on;
          gzip_vary on;
          gzip_comp_level 4;
          gzip_min_length 256;
          gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
          gzip_types application/atom+xml application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;
          
          root /var/www/html;
          
          add_header Referrer-Policy "no-referrer" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Download-Options "noopen" always;
          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header X-Permitted-Cross-Domain-Policies "none" always;
          add_header X-Robots-Tag "noindex, nofollow" always;
          add_header X-XSS-Protection "1; mode=block" always;
          
          fastcgi_hide_header X-Powered-By;
          
          location = /robots.txt {
              allow all;
              log_not_found off;
              access_log off;
          }
          
          location ^~ /.well-known {
              location = /.well-known/carddav { return 301 /remote.php/dav/; }
              location = /.well-known/caldav  { return 301 /remote.php/dav/; }
              location /.well-known/acme-challenge { try_files $uri $uri/ =404; }
              location /.well-known/pki-validation { try_files $uri $uri/ =404; }
              return 301 /index.php$request_uri;
          }
          
          location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) { return 404; }
          location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) { return 404; }
          
          location ~ \.php(?:$|/) {
              rewrite ^/(?!index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|oc[ms]-provider\/.+|.+\/richdocumentscode\/proxy) /index.php$request_uri;
              
              fastcgi_split_path_info ^(.+?\.php)(/.*)$;
              set $path_info $fastcgi_path_info;
              
              try_files $fastcgi_script_name =404;
              
              include fastcgi_params;
              fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
              fastcgi_param PATH_INFO $path_info;
              fastcgi_param HTTPS on;
              fastcgi_param modHeadersAvailable true;
              fastcgi_param front_controller_active true;
              
              fastcgi_pass php-handler;
              fastcgi_intercept_errors on;
              fastcgi_request_buffering off;
          }
          
          location ~ \.(?:css|js|svg|gif|png|jpg|ico|wasm|tflite|map)$ {
              try_files $uri /index.php$request_uri;
              add_header Cache-Control "public, max-age=15778463";
              access_log off;
          }
          
          location ~ \.woff2?$ {
              try_files $uri /index.php$request_uri;
              expires 7d;
              access_log off;
          }
          
          location /remote {
              return 301 /remote.php$request_uri;
          }
          
          location / {
              try_files $uri $uri/ /index.php$request_uri;
          }
      }

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "16G"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # X-Forwarded-For header chain (important for trusted_proxies)
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    nginx.ingress.kubernetes.io/enable-real-ip: "true"
    # CORS support
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "X-Forwarded-For"
    # HSTS header for security (6 months)
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "15552000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    # NOTE: Removed server-snippet for caldav/carddav - caused duplicate location errors
    # Nextcloud handles these redirects internally
  tls:
    - secretName: nextcloud-tls
      hosts: []

# Service configuration
service:
  type: ClusterIP
  port: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"

# Persistence configuration
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 50Gi
  storageClass: ""
  
  nextcloudData:
    enabled: false  # Data goes to S3

# Cron job
cronjob:
  enabled: true
  schedule: "*/5 * * * *"
  annotations:
    prometheus.io/scrape: "false"
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  cronjob:
    priorityClassName: ""  # Disable - not available in cluster
  # No requests – Kubernetes schedules freely and throttles CPU if needed.
  # Only limits are set to cap runaway jobs. Prefer throttle over OOM.
  sidecar:
    resources:
      limits:
        cpu: 300m
        memory: 1Gi

# Probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 60
  successThreshold: 1

# Resources – no requests, only limits (prefer throttle over reservation)
resources:
  limits:
    cpu: 2
    memory: 2Gi

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

# Don't set deprecated top-level securityContext
# The correct key is nextcloud.podSecurityContext (set in nextcloud section above)

# Priority class (disabled - cluster doesn't have nextcloud-tenant-high)
priorityClassName: ""

# Node selector
nodeSelector:
  kubernetes.io/os: linux

# Affinity
affinity: {}

# Tolerations
tolerations: []

# HPA
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Metrics (Prometheus)
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    # namespace: monitoring  # Uncomment if Prometheus is in specific namespace
    # labels:
    #   release: prometheus  # Add if your Prometheus uses label selectors

# Redis (external - platform service)
redis:
  enabled: false

# Extra environment variables
extraEnv:
  - name: PHP_MEMORY_LIMIT
    value: "2048M"
  - name: PHP_UPLOAD_LIMIT
    value: "16G"
  - name: NEXTCLOUD_INIT_HTACCESS
    value: "true"
  - name: NC_default_phone_region
    value: "NL"

# Extra volumes
extraVolumes:
  - name: nextcloud-logs
    emptyDir: {}

extraVolumeMounts:
  - name: nextcloud-logs
    mountPath: /var/log/nextcloud
