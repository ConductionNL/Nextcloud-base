---
tenant:
  name: zutphen-accept
  # Use accept env values for both -accept and -test tenants
  environment: accept
  wave: "1"
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # Migratie legacy frontend (ns zutphen) 2026-07-06 — waardes 1:1 uit de
  # legacy deploy (tag dev = huidige legacy tag; bewust later bumpen).
  # Favicon is een inline data-URI en gaat live mee (ignore-diff).
  frontend:
    tag: dev
    host: acceptatie-open.zutphen.nl
    tls:
      secretName: acceptatie-open-zutphen-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: Gemeente Zutphen
      themeClassname: zutphen-theme
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-zutphen/main/jumbotron.jpg"
