---
tenant:
  name: lansingerland-accept
  environment: accept
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    host: acceptatie-open.lansingerland.nl
    tls:
      secretName: acceptatie-open-lansingerland-nl-tls
      issuer: none
    branding:
      organisationName: "Gemeente Lansingerland"
      themeClassname: "lansingerland-theme"
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-template/main/pwa/src/assets/jumbotron/jumbotronLansingerland.jpg"
