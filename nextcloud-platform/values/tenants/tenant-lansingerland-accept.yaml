---
tenant:
  name: lansingerland-accept
  environment: accept
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    host: acceptatie-open.lansingerland.nl
    tag: "v1.0.0"
    registry: "ghcr.io"
    repository: "conductionnl/woo-website-v2"
    tls:
      secretName: acceptatie-open-lansingerland-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: "Gemeente Lansingerland"
      themeClassname: "lansingerland-theme"
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/lansingerland/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/lansingerland/favicon.ico