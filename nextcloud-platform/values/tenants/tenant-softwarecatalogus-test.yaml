---
tenant:
  name: softwarecatalogus-test
  # Use accept env values for both -accept and -test tenants
  environment: accept
  wave: "1"
  dbType: postgres
  namespace: softwarecatalogus-test
  # Geen WOO-portaal — geen react-frontend (FASE 2-opt-out 2026-07-06; de
  # react-tenants appset filtert tenant.frontend.enabled=false via post-selector).
  frontend:
    enabled: false
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister

