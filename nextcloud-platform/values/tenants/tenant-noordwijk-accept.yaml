---
tenant:
  name: noordwijk-accept
  environment: accept
  wave: "1"
  dbType: mariadb
  apps:
    enabled:
      - openregister
      - opencatalogi
      - openconnector
  # Migratie legacy frontend (ns noordwijk) 2026-07-06 — waardes 1:1 uit de
  # legacy deploy. Favicon is een inline data-URI en gaat live mee (ignore-diff).
  frontend:
    tag: latest
    host: acceptatie-open.noordwijk.nl
    tls:
      secretName: acceptatie-open-noordwijk-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: Gemeente noordwijk
      themeClassname: noordwijk-theme
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-noordwijk/main/images/Bollenvelden%20Panorama%20Noordwijkerhout%20-%20Luchtfoto%5B3766%5D.JPG"
