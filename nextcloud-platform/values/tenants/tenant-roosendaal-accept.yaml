---
tenant:
  name: roosendaal-accept
  # Use accept env values for both -accept and -test tenants
  environment: accept
  wave: "1"
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # Migratie legacy frontend (ns roosendaal) 2026-07-06 — waardes 1:1 uit de
  # legacy deploy (tag dev = huidige legacy tag; org-naam met kleine 'g' zoals
  # in legacy). Favicon is een inline data-URI en gaat live mee (ignore-diff).
  frontend:
    tag: dev
    host: acceptatie-open.roosendaal.nl
    tls:
      secretName: acceptatie-open-roosendaal-nl-tls
      # Betaald certSIGN-cert (verloopt 18 okt 2026), handmatig gezaaid.
      # issuer: none => geen cert-manager-annotatie op de Ingress, dus geen
      # Certificate-object en geen Let's Encrypt die het klantcert overschrijft.
      issuer: none
    branding:
      organisationName: gemeente Roosendaal
      themeClassname: roosendaal-theme
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-roosendaal/main/roosendaal_jumbotron.jpg"
