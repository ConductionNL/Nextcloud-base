---
tenant:
  name: gouda-prod
  environment: prod
  wave: "1"
  dbType: mariadb
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
    versions:
      opencatalogi: "0.7.12"
      openconnector: "0.2.16"
      openregister: "0.2.11"
  # Branding-baseline 2026-07-06 (FASE 2) — GATSBY_-env is ignore-diffed,
  # devs kunnen live bijstellen; dit is de GitOps-startwaarde.
  frontend:
    tag: "v1.0.0"
    registry: "ghcr.io"
    repository: "conductionnl/woo-website-v2"
    branding:
      organisationName: Gemeente Gouda
      themeClassname: gouda-theme
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/gouda/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/gouda/favicon.ico