tenant:
  name: noordwijk-prod
  environment: prod
  wave: "1"
  dbType: mariadb
  apps:
    enabled:
      - openregister
      - opencatalogi
      - openconnector
  # Migratie legacy frontend (ns noordwijk) 2026-07-06. Besluit mwest: prod
  # verhuist van open.noordwijk.nl naar het afgeleide noordwijk.openwoo.app —
  # dus geen host/tls hier (wildcard-cert dekt). Branding 1:1 uit de legacy
  # deploy; favicon is een inline data-URI en gaat live mee (ignore-diff).
  frontend:
    tag: latest
    branding:
      organisationName: Gemeente Noordwijk
      themeClassname: noordwijk-theme
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-noordwijk/main/images/Bollenvelden%20Panorama%20Noordwijkerhout%20-%20Luchtfoto%5B3766%5D.JPG"
    env:
      GATSBY_FOOTER_CONTENT: "https://raw.githubusercontent.com/ConductionNL/woo-website-noordwijk/main/FooterContent.json"
      GATSBY_FOOTER_CONTENT_HEADER: "heading-4"
      GATSBY_FOOTER_LOGO_HREF: "https://www.noordwijk.nl/"
      GATSBY_FOOTER_LOGO_URL: "false"

cronjob:
  sidecar:
    resources:
      limits:
        memory: 3Gi
