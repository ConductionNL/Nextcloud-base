---
tenant:
  name: epe-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    tag: "v1.0.0"
    registry: "ghcr.io"
    repository: "conductionnl/woo-website-v2"
    host: open.epe.nl
    # Het tls-blok MOET hier staan, ook zonder cert-manager. Zonder secretName
    # valt de react-tenants-ApplicationSet terug op de default
    # wildcard-openwoo-tls (*.openwoo.app), en die naam past niet bij deze host:
    # nginx serveert dan zijn fake-certificaat. Dat is op 2026-08-11 gebeurd toen
    # het blok in zijn geheel werd weggehaald.
    tls:
      secretName: open-epe-nl-tls
      # Sectigo OV (Gemeente Epe), verloopt 2027-02-28, geplaatst met certswap
      # op 2026-08-14 uit de bundel van de gemeente.
      # Procedure: openwoo-app-config/docs/custom-domain-cert.md.
      # Let's Encrypt kan hier niet: het CAA-record van epe.nl staat alleen
      # digicert, certSIGN, kpn, entrust, sectigo en ssl.com toe.
      # issuer none = geen annotatie, geen Certificate, dus niets dat het
      # klantcertificaat kan overschrijven.
      # Verlenging: opvragen bij gemeente Epe (geen CertificateExpiringSoon-dekking).
      issuer: none
    branding:
      organisationName: "gemeente Epe"
      themeClassname: "epe-theme"
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/epe/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/epe/favicon.ico