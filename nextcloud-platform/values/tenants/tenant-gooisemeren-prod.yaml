---
tenant:
  name: gooisemeren-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    host: open.gooisemeren.nl
    tls:
      secretName: open-gooisemeren-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: "Gemeente Gooisemeren"
      themeClassname: "gooise-meren-theme"
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/gooise-meren/jumbotron.webp"
