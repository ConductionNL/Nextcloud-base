tenant:
  name: gooisemeren-prod
  environment: prod
  wave: "1"
  dbType: mariadb
  features:
    appapi: false
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
    versions:
      opencatalogi: "0.7.8"
      openconnector: "0.2.8"
      openregister: "0.2.11"

# Override van de platform-default (50Gi in common.yaml).
# Gooisemeren is de enige tenant met substantiële lokale schijfbehoefte;
# PVC is in-cluster al naar 250Gi opgerekt. Deze override zorgt dat Argo
# desired == actual ziet en niet meer probeert te reverten.
persistence:
  size: 250Gi
