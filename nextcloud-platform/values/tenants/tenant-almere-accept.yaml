tenant:
  name: almere-accept
  environment: accept
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
    versions:
      opencatalogi: "1.0.9"
      openconnector: "0.2.20"
      openregister: "1.1.5"
  frontend:
    branding:
      organisationName: "Gemeente Almere"
      themeClassname: "almere-theme"
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/almere/jumbotron.webp"
      faviconUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/almere/favicon.ico"
