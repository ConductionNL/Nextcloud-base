---
tenant:
  name: stichtsevecht-accept
  environment: accept
  wave: "1"
  dbType: mariadb
  apps:
    enabled:
      - openregister
      - opencatalogi
      - openconnector
  # Migratie legacy frontend (ns stichtsevecht) 2026-07-06 — waardes 1:1 uit de
  # legacy deploy. Favicon is een inline data-URI en gaat live mee (ignore-diff).
  frontend:
    host: acceptatie-open.stichtsevecht.nl
    tag: "v1.0.0"
    registry: "ghcr.io"
    repository: "conductionnl/woo-website-v2"
    tls:
      secretName: acceptatie-open-stichtsevecht-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: "Gemeente Stichtse Vecht"
      themeClassname: stichtse-vecht-theme
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/stichtsevecht/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/stichtsevecht/favicon.ico