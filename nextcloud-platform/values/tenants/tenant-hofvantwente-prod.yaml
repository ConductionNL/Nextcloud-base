---
tenant:
  name: hofvantwente-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    host: open.hofvantwente.nl
    tls:
      secretName: open-hofvantwente-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: "Gemeente Hof van Twente"
      # hofvantwente-theme bestaat niet in de gebundelde thema's; de klasse werd
      # ongewijzigd doorgegeven aan GATSBY_NL_DESIGN_THEME_CLASSNAME en leverde
      # dus stilzwijgend geen huisstijl op. hof-van-twente-theme is wat de
      # accept-tenant gebruikt en wat in conduction-theme staat.
      themeClassname: "hof-van-twente-theme"
      # Overgenomen uit de draaiende Deployment op 2026-08-11. Stond daar als
      # live-edit en niet in git, dus zonder deze regel had de branding-reconcile
      # hem weggegooid zodra de per-tenant ignore-diff verdween.
      faviconUrl: "data:image/png;base64,"
