---
tenant:
  name: tubbergen-accept
  # Use accept env values for both -accept and -test tenants
  environment: accept
  wave: "1"
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # Migratie legacy frontend (ns tubbergen) 2026-07-06 — waardes 1:1 uit de
  # legacy deploy (favicon/footer-href waren daar leeg; theme deelt assets met
  # noaberkracht). Favicon evt. later live zetten (ignore-diff).
  frontend:
    tag: "v1.0.0"
    registry: "ghcr.io"
    repository: "conductionnl/woo-website-v2"
    host: acceptatie-open.tubbergen.nl
    tls:
      secretName: acceptatie-open-tubbergen-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: "Gemeente Tubbergen"
      themeClassname: tubbergen-theme
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/tubbergen/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/tubbergen/favicon.ico
