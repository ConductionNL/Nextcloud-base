---
tenant:
  name: buren-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    host: open.buren.nl
    tls:
      secretName: open-buren-nl-tls
      issuer: none
    branding:
      organisationName: "Gemeente Buren"
      themeClassname: "buren-theme"
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-assets/66a28f55b1cffe194386f0691e6a4a54f179d116/municipalities/buren/source/burenJumbotron.jpg"
