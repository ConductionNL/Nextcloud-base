---
# =============================================================================
# TENANT: zuiddrecht-accept
# Domain: zuiddrecht.accept.commonground.nu
# Namespace: zuiddrecht-accept
# =============================================================================

tenant:
  name: zuiddrecht-accept
  namespace: zuiddrecht-accept
  environment: accept
  wave: "1"
  hostname: zuiddrecht.accept.commonground.nu

  s3:
    bucket: nextcloud
    prefix: "zuiddrecht-accept/"

# MariaDB (default) - keep enabled
mariadb:
  enabled: true
  auth:
    database: nextcloud
    username: nextcloud
    existingSecret: nextcloud-secrets
    secretKeys:
      mariadb-root-password: mariadb-root-password
      mariadb-password: mariadb-password

# Disable alternatives
internalDatabase:
  enabled: false

externalDatabase:
  enabled: false
  existingSecret:
    enabled: false

nextcloud:
  host: zuiddrecht.accept.commonground.nu
  trustedDomains:
    - zuiddrecht.accept.commonground.nu

ingress:
  tls:
    - secretName: nextcloud-zuiddrecht-accept-tls
      hosts:
        - zuiddrecht.accept.commonground.nu
  hosts:
    - host: zuiddrecht.accept.commonground.nu
      paths:
        - path: /
          pathType: Prefix
