---
tenant:
  name: oudeijsselstreek-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    host: open.oude-ijsselstreek.nl
    branding:
      organisationName: "Gemeente Oude IJsselstreek"
    tls:
      secretName: oudeijsselstreek-frontend-tls
      # Betaald certSIGN-cert (verloopt 14 feb 2027), handmatig gezaaid.
      # issuer: none => geen cert-manager-annotatie op de Ingress, dus geen
      # Certificate-object en geen Let's Encrypt die het klantcert overschrijft.
      issuer: none
