tenant:
  name: rijswijk-accept
  environment: accept
  wave: "1"
  dbType: mariadb
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # Branding-baseline 2026-07-06 (FASE 2) — GATSBY_-env is ignore-diffed,
  # devs kunnen live bijstellen; geen rijswijk-theme in de app-bundle.
  frontend:
    branding:
      organisationName: Gemeente Rijswijk

image:
  registry: ghcr.io
  repository: conductionnl/nextcloud-images
  # Patch-versietag, niet de zwevende `fpm-soap`. Die laatste werd bij elke
  # build overschreven; met pullPolicy IfNotPresent hing de draaiende
  # Nextcloud-versie daardoor af van wanneer een node voor het laatst pullde.
  # Aantoonbaar: op 2026-08-19 verschoof `fpm-soap` van sha256:31123c8c naar
  # sha256:80310a36 zonder dat hier iets veranderde.
  #
  # Het `digest:`-veld is weggehaald: chart 8.9.0 rendert het niet, de podspec
  # bevatte alleen `:fpm-soap` en geen `@sha256`. De digest die er stond was
  # Nextcloud 32.0.5 terwijl de pod 32.0.6 draaide — Git beweerde dus iets
  # anders dan er liep.
  #
  # Tag komt uit ConductionNL/nextcloud-images; de workflow leidt het
  # versienummer af uit de `FROM` van soap-client/Dockerfile.
  tag: "32.0.6-fpm-soap"
