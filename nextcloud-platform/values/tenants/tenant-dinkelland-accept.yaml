---
tenant:
  name: dinkelland-accept
  # Use accept env values for both -accept and -test tenants
  environment: accept
  wave: "1"
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # Migratie legacy frontend (ns dinkelland) 2026-07-06 — waardes 1:1 uit de
  # legacy deploy; favicon is een inline data-URI en gaat live mee (ignore-diff).
  frontend:
    tag: latest
    host: acceptatie-open.dinkelland.nl
    tls:
      secretName: acceptatie-open-dinkelland-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: Gemeente Dinkelland
      themeClassname: dinkelland-theme
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-dinkelland/main/jumbotron.jpg
