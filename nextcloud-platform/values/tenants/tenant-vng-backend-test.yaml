---
tenant:
  name: vng-backend-test
  environment: accept
  wave: "1"
  dbType: postgres
  namespace: vng-backend-test
  phpMemoryLimit: "2048M"
  hostname: backend.test.opencatalogi.nl
  # Bewuste afwijking van commonground.nu (VNG-backend op opencatalogi.nl).
  hostnameOverride: true
  # Geen WOO-portaal — geen react-frontend (FASE 2-opt-out 2026-07-06; de
  # react-tenants appset filtert tenant.frontend.enabled=false via post-selector).
  frontend:
    enabled: false
  apps:
    enabled:
      - opencatalogi
      - openregister
    # versions:
    #   opencatalogi: "0.7.8-beta.13"
    #   openregister: "0.2.12-unstable.1"
resources:
  limits:
    memory: 4Gi
nextcloud:
  extraEnv:
    - name: PHP_MEMORY_LIMIT
      value: "4096M"

