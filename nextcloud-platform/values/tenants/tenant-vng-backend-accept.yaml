---
tenant:
  name: vng-backend-accept
  environment: accept
  wave: "1"
  dbType: postgres
  namespace: vng-backend-accept
  phpMemoryLimit: "2048M"
  hostname: backend.accept.opencatalogi.nl
  # Geen WOO-portaal — geen react-frontend (FASE 2-opt-out 2026-07-06; de
  # react-tenants appset filtert tenant.frontend.enabled=false via post-selector).
  frontend:
    enabled: false
resources:
  limits:
    memory: 4Gi
nextcloud:
  extraEnv:
    - name: PHP_MEMORY_LIMIT
      value: "4096M"
  apps:
    enabled:
      - opencatalogi
      - openregister
    # versions:
    #   opencatalogi: "0.7.8-beta.13"
    #   openregister: "0.2.12-unstable.1"

