---
tenant:
  name: tubbergen-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    tag: "latest"
    host: open.tubbergen.nl
    tls:
      secretName: open-tubbergen-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: "Gemeente tubbergen"
      themeClassname: "tubbergen-theme"
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-tubbergen/main/jumbotron.jpg"
