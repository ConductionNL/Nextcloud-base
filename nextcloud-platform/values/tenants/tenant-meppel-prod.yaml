tenant:
  name: meppel-prod
  environment: prod
  wave: "1"
  dbType: mariadb
  features:
    appapi: false
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # Branding-baseline 2026-07-06 (FASE 2) — GATSBY_-env is ignore-diffed,
  # devs kunnen live bijstellen; geen meppel-theme in de app-bundle.
  frontend:
    branding:
      organisationName: Gemeente Meppel
