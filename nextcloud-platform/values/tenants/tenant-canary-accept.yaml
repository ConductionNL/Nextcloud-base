---
tenant:
  name: canary-accept
  environment: accept
  wave: "0"
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # TWEE PROEVEN (2026-08-11), beide te verwijderen zodra ze bevestigd zijn.
  #
  # 1. Image-pin. Verifieert dat een pin uit git daadwerkelijk op een BESTAANDE
  #    Deployment landt. Tot 2026-08-11 was de image ignore-diffed en bleef live
  #    op de platform-default staan. De tag wijkt bewust af van
  #    values/common.yaml, zodat de uitkomst ondubbelzinnig is.
  #
  # 2. BYO-certificaat. `issuer: none` zet géén cert-manager-annotatie op de
  #    Ingress, dus geen Certificate-object en geen Let's Encrypt die het
  #    gezaaide secret overschrijft. Dat is de tak die roosendaal-prod al
  #    gebruikt voor zijn gekochte certSIGN-cert; hier getoetst met een
  #    self-signed cert op een host waar dat niemand pijn doet.
  #
  #    Het secret `canary-selfsigned-tls` wordt HANDMATIG gezaaid en staat niet
  #    in git — zie React-base docs/ADDING-TENANT.md § "TLS-velden". Zonder dat
  #    secret serveert de Ingress geen bruikbaar cert, dus zaai eerst, push
  #    daarna.
  #
  # Terugdraaien = dit blok weghalen. De image valt dan terug op de
  # platform-default en de Ingress op wildcard-openwoo-tls.
  frontend:
    registry: "docker.io"
    repository: "conduction2022/woo-website-v2"
    tag: "V1.0.260519-development"
    tls:
      secretName: canary-selfsigned-tls
      issuer: none
    branding:
      organisationName: "Canary (proefpin 2026-08-11)"

