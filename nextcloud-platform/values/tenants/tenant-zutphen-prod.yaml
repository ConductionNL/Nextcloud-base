---
tenant:
  name: zutphen-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    host: open.zutphen.nl
    tls:
      secretName: open-zutphen-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: "Gemeente Zutphen"
      themeClassname: "zutphen-theme"
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-zutphen/main/jumbotron.jpg"
