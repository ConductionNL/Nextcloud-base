---
tenant:
  name: zutphen-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    host: open.zutphen.nl
    tag: "v1.0.0"
    registry: "ghcr.io"
    repository: "conductionnl/woo-website-v2"
    tls:
      secretName: open-zutphen-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: "Gemeente Zutphen"
      themeClassname: "zutphen-theme"
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/zutphen/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/zutphen/favicon.ico
