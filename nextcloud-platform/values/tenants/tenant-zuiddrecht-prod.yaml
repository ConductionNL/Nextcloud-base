---
# =============================================================================
# TENANT: zuiddrecht-prod
# Domain: zuiddrecht.commonground.nu
# Namespace: zuiddrecht-prod
# =============================================================================

tenant:
  name: zuiddrecht-prod
  namespace: zuiddrecht-prod
  environment: prod
  wave: "1"
  hostname: zuiddrecht.commonground.nu

  s3:
    bucket: nextcloud
    prefix: "zuiddrecht-prod/"

# MariaDB (default) - keep enabled
mariadb:
  enabled: true

nextcloud:
  host: zuiddrecht.commonground.nu
  trustedDomains:
    - zuiddrecht.commonground.nu

ingress:
  tls:
    - secretName: nextcloud-zuiddrecht-prod-tls
      hosts:
        - zuiddrecht.commonground.nu
  hosts:
    - host: zuiddrecht.commonground.nu
      paths:
        - path: /
          pathType: Prefix
