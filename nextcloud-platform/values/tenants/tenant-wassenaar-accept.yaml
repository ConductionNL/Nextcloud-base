---
tenant:
  name: wassenaar-accept
  environment: accept
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    tag: "v1.0.0"
    host: open.openwoo.app
    registry: "ghcr.io"
    repository: "conductionnl/woo-website-v2"
    branding:
      organisationName: "gemeente Wassenaar"
      themeClassname: "wassenaar-theme"
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/other/wassenaar/jumbotron.webp"
      faviconUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/other/wassenaar/favicon.ico"
      footerHideLogo: "true"
