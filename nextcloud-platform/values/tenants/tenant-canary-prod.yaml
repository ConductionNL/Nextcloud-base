---
tenant:
  name: canary-prod
  environment: prod
  wave: "0"
  canary: true
  # In-cluster per-tenant PostgreSQL (Bitnami subchart, conduction2022 image).
  # NOT the shared CNPG/PgBouncer path (dbType: external) — that backend is
  # currently unrecoverable. Rebuilt off mariadb on 2026-06-08.
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister

# Phase 1 PoC: stateless emptyDir RS=1 (RS=2 blocked by CAN_INSTALL race — investigate next)
# Graduation criteria: 7 days clean at RS=1, then fix RS=2 before Phase 2
replicaCount: 1

persistence:
  enabled: false
