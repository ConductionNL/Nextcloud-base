---
tenant:
  name: canary-prod
  environment: prod
  wave: "0"
  canary: true
  dbType: mariadb
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister

# Canary: RWX PVC kept for HA investigation; RS=1 until cluster filesystem solved
# (RS=2 + concurrent ext4 = corruption, confirmed 2026-03-09)
replicaCount: 1

# RWX allows RollingUpdate — no downtime during pod restarts
nextcloud:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

persistence:
  accessMode: ReadWriteMany
  storageClass: cinder-rwx
