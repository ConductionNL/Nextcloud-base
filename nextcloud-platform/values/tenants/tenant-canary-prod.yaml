---
tenant:
  name: canary-prod
  environment: prod
  wave: "0"
  # In-cluster per-tenant PostgreSQL (Bitnami subchart, conduction2022 image).
  # NOT the shared CNPG/PgBouncer path (dbType: external) — that backend is
  # currently unrecoverable.
  # Plain durable tenant: the stateless emptyDir + S3 PoC (canary: true +
  # canary-overrides) is shelved — the live ApplicationSet never loaded
  # canary-overrides, so it was inert. Made durable on 2026-06-08; canary-prod
  # keeps its wave-0 role as the rollout canary.
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister

replicaCount: 1

# =============================================================================
# TIJDELIJKE SPIEGEL AAN ACCEPT (2026-07-10) — canary-prod werkt momenteel niet.
# tenant.environment moet 'prod' blijven (validate-values dwingt de suffix-match
# af), dus de accept-laag (values/env/accept.yaml) wordt hieronder per onderdeel
# gespiegeld. Dit bestand is het laatste valueFile en wint van env/prod.yaml;
# `null` verwijdert een key uit de merge, lijsten vervangen integraal.
# Bewust NIET gespiegeld: podLabels (identiteit blijft prod) en de
# ssl-redirect ingress-annotaties.
# Terugdraaien = alles onder deze streep verwijderen.
# =============================================================================

# accept resources (i.p.v. prod 4 CPU / 6Gi)
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 3Gi

# accept: geen dedicated node pool, geen anti-affinity/spreiding, geen PDB
nodeSelector:
  worker.gardener.cloud/pool: null
affinity: null
topologySpreadConstraints: []
podDisruptionBudget:
  enabled: false

# accept probe-timings (timeoutSeconds 10 komt uit common.yaml, gelijk in beide)
livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 30
  failureThreshold: 3
readinessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3
startupProbe:
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 30

# accept cron-frequentie; sidecar-memory terug naar common (1Gi i.p.v. prod 2Gi)
cronjob:
  schedule: "*/15 * * * *"
  sidecar:
    resources:
      limits:
        memory: 1Gi

# accept: geen expliciete nginx-sidecar-resources (common zet er geen)
nginx:
  resources: null

nextcloud:
  # accept: INFO-logging naar bestand (helpt ook bij de diagnose van canary-prod)
  configs:
    logging.config.php: |
      <?php
      $CONFIG = array (
        'loglevel' => 1,  // INFO level for accept
        'log_type' => 'file',
        'logfile' => '/var/log/nextcloud/nextcloud.log',
      );
  # www.conf terug naar de common.yaml-versie: memory_limit 2048M (prod zet 4096M)
  phpConfigs:
    www.conf: |
      [www]
      user = www-data
      group = www-data
      listen = 127.0.0.1:9000

      pm = dynamic
      pm.max_children = 50
      pm.start_servers = 5
      pm.min_spare_servers = 5
      pm.max_spare_servers = 35
      pm.max_requests = 500

      ; PHP-FPM status endpoint (for monitoring)
      pm.status_path = /fpm-status
      pm.status_listen = 127.0.0.1:9001
      ping.path = /fpm-ping
      ping.response = pong

      ; PHP settings
      php_admin_value[memory_limit] = 2048M
      php_admin_value[upload_max_filesize] = 16G
      php_admin_value[post_max_size] = 16G
      php_admin_value[max_execution_time] = 3600
      php_admin_value[max_input_time] = 3600
      php_admin_value[output_buffering] = Off
