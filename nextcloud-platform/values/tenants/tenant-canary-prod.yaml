---
tenant:
  name: canary-prod
  environment: prod
  wave: "0"
  canary: true
  dbType: mariadb
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister

# Canary: RS=2 HA via Cinder multi-attach (tier-1m)
replicaCount: 2

persistence:
  accessMode: ReadWriteMany
  storageClass: cinder-rwx
