---
tenant:
  name: canary-prod
  environment: prod
  wave: "0"
  canary: true
  dbType: mariadb
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister

# Phase 1 PoC: stateless emptyDir + RS=2 (started 2026-03-09)
# persistence.enabled: false is set in canary-overrides.yaml
# Graduation criteria: 7 days clean, see specs/canary-gate/spec.md
replicaCount: 2

# RollingUpdate: maxSurge=1 maxUnavailable=0 → zero downtime with RS=2
nextcloud:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
