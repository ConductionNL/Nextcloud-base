---
tenant:
  name: zoeterwoude-accept
  # Use accept env values for both -accept and -test tenants
  environment: accept
  wave: "1"
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # Branding-baseline 2026-07-06 (FASE 2) — GATSBY_-env is ignore-diffed,
  # devs kunnen live bijstellen; geen zoeterwoude-theme in de app-bundle.
  frontend:
    branding:
      organisationName: Gemeente Zoeterwoude
