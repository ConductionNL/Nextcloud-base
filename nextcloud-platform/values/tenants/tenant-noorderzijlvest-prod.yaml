---
tenant:
  name: noorderzijlvest-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    host: open.noorderzijlvest.nl
    tls:
      secretName: open-noorderzijlvest-nl-tls
      issuer: cert-manager-issuer-prod
    branding:
      organisationName: "Waterschap Noorderzijlvest"
      themeClassname: noorderzijlvest-theme
      jumbotronImageUrl: "https://noorderzijlvest.commonground.nu/core/preview?fileId=518&x=3440&y=1440&a=true&etag=7dc48eb50db3bffe8396288398e6018c"
    env:
      GATSBY_FOOTER_HIDE_LOGO: "true"
      GATSBY_FOOTER_CONTENT_HEADER: "heading-2"
