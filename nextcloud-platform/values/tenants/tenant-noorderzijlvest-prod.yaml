---
tenant:
  name: noorderzijlvest-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    host: open.noorderzijlvest.nl
    tag: "v1.0.0"
    registry: "ghcr.io"
    repository: "conductionnl/woo-website-v2"
    tls:
      secretName: open-noorderzijlvest-nl-tls
      # Betaald Sectigo-cert (verloopt 27 nov 2026), teruggezet op 3 jun 2026.
      # Stond op issuer "cert-manager-issuer-prod": die ClusterIssuer bestaat
      # niet, waardoor het Certificate op Ready=False bleef en het klantcert bij
      # toeval overleefde. issuer: none is hetzelfde effect, maar expliciet:
      # geen annotatie, geen Certificate-object, geen Let's Encrypt eroverheen.
      issuer: none
    branding:
      organisationName: "Waterschap Noorderzijlvest"
      themeClassname: noorderzijlvest-theme
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/water-authorities/noorderzijlvest/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/water-authorities/noorderzijlvest/favicon.ico
    env:
      GATSBY_FOOTER_HIDE_LOGO: "true"
      GATSBY_FOOTER_CONTENT_HEADER: "heading-2"
      GATSBY_JUMBOTRON_TITLE: "Openbare documenten van Waterschap Noorderzijlvest"
      GATSBY_JUMBOTRON_SUBTITLE: "Op deze website vind je de documenten die Waterschap Noorderzijlvest openbaar heeft gemaakt."
