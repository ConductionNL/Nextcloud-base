---
tenant:
  name: noorderzijlvest-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
    versions:
      opencatalogi: "1.0.9"
      openconnector: "0.2.24"
      openregister: "1.1.5"
  frontend:
    tag: "v1.0.0"
    host: open.noorderzijlvest.nl
    tls:
      secretName: open-noorderzijlvest-nl-tls
      # Betaald Sectigo-cert (verloopt 13 mei 2027), handmatig gezaaid.
      # issuer: none => geen cert-manager-annotatie op de Ingress, dus geen
      # Certificate-object en geen Let's Encrypt die het klantcert overschrijft.
      issuer: none
    branding:
      organisationName: "Waterschap Noorderzijlvest"
      themeClassname: "noorderzijlvest-theme"
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-assets/main/water-authorities/noorderzijlvest/jumbotron.webp"
      faviconUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-assets/main/water-authorities/noorderzijlvest/favicon.ico"
    env:
      GATSBY_JUMBOTRON_TITLE: "Openbare documenten van Waterschap Noorderzijlvest"
      GATSBY_JUMBOTRON_SUBTITLE: "Op deze website vind je de documenten die Waterschap Noorderzijlvest openbaar heeft gemaakt."
