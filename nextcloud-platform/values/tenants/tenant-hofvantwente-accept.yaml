---
tenant:
  name: hofvantwente-accept
  # Use accept env values for both -accept and -test tenants
  environment: accept
  wave: "1"
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # Migratie legacy frontend (ns hofvantwente) 2026-07-06 — waardes 1:1 uit de
  # legacy deploy (tag dev; cert was al letsencrypt via los Certificate CR).
  # Jumbotron komt uit de eigen Nextcloud (publicpreview) — host blijft gelijk.
  # Favicon is een inline data-URI en gaat live mee (ignore-diff).
  frontend:
    tag: "v1.0.0"
    registry: "ghcr.io"
    repository: "conductionnl/woo-website-v2"
    host: acceptatie-open.hofvantwente.nl
    tls:
      secretName: acceptatie-open-hofvantwente-nl-tls
      # Betaald certSIGN-cert (verloopt 11 sep 2026), handmatig gezaaid.
      # issuer: none => geen cert-manager-annotatie op de Ingress, dus geen
      # Certificate-object en geen Let's Encrypt die het klantcert overschrijft.
      issuer: none
    branding:
      organisationName: Gemeente Hof van Twente
      themeClassname: hof-van-twente-theme
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/hof-van-twente/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/hof-van-twente/favicon.ico
      footerHideLogo: true
    env:
      GATSBY_ANALYTICS_URL: "https://siteimproveanalytics.com/js/siteanalyze_6006029.js"
      GATSBY_FOOTER_HIDE_LOVE: "true"
