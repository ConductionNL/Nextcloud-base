---
tenant:
  name: conduction-straattest-accept
  environment: accept
  wave: "1"
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # react-base coupling: this block is read by the react-tenants ApplicationSet
  # in the React-base repo (git-generator over this dir). Minimal branding so the
  # full street is exercised end-to-end (tenant file -> appset template ->
  # GATSBY_ORGANISATION_NAME on the WOO PWA). Host/upstream derive automatically:
  #   frontend -> conduction-straattest.accept.openwoo.app
  #   upstream -> conduction-straattest.accept.commonground.nu (this NC backend)
  frontend:
    branding:
      organisationName: "Straattest"
