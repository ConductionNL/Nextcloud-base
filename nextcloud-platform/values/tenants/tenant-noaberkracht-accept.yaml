---
tenant:
  name: noaberkracht-accept
  # Use accept env values for both -accept and -test tenants
  environment: accept
  wave: "1"
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # Migratie legacy frontend (ns noaberkracht) 2026-07-06 — waardes 1:1 uit de
  # legacy deploy (jumbotron deelt bewust het tubbergen-asset; Noaberkracht =
  # samenwerking Tubbergen+Dinkelland). Favicon gaat live mee (ignore-diff).
  frontend:
    host: acceptatie-open.noaberkracht.nl
    tag: "v1.0.0"
    registry: "ghcr.io"
    repository: "conductionnl/woo-website-v2"
    tls:
      secretName: acceptatie-open-noaberkracht-nl-tls
      # Betaald Trust Provider-cert (verloopt 13 okt 2026), handmatig gezaaid.
      # issuer: none => geen cert-manager-annotatie op de Ingress, dus geen
      # Certificate-object en geen Let's Encrypt die het klantcert overschrijft.
      issuer: none
    branding:
      organisationName: Gemeente Noaberkracht
      themeClassname: noaberkracht-theme
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/partnerships/noaberkracht/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/partnerships/noaberkracht/favicon.ico