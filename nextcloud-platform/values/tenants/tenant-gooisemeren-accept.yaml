---
tenant:
  name: gooisemeren-accept
  environment: accept
  wave: "1"
  dbType: mariadb
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
    versions:
      opencatalogi: "0.7.8"
      openconnector: "0.2.8"
      openregister: "0.2.11"
  # Migratie legacy frontend (ns gooisemeren) 2026-07-06 — waardes 1:1 uit de
  # legacy deploy (org-naam incl. kleine letters; live bij te stellen).
  # Favicon is een inline data-URI en gaat live mee (ignore-diff).
  frontend:
    tag: latest
    host: acceptatie-open.gooisemeren.nl
    tls:
      secretName: acceptatie-open-gooisemeren-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: Gemeente gooisemeren
      themeClassname: gooise-meren-theme
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-gooisemeren/main/jumbotron.jpg
