tenant:
  name: roosendaal-prod
  environment: prod
  wave: "1"
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # Migratie legacy frontend (ns roosendaal) 2026-07-06 — waardes 1:1 uit de
  # legacy deploy; backend serveert zelf roosendaal.commonground.nu (geen
  # migrate-host), upstream default klopt. Favicon gaat live mee (ignore-diff).
  frontend:
    tag: "v1.0.0"
    registry: "ghcr.io"
    repository: "conductionnl/woo-website-v2"
    host: open.roosendaal.nl
    tls:
      secretName: open-roosendaal-nl-tls
      # Betaald certSIGN-cert (verloopt 18 okt 2026), handmatig gezaaid.
      # issuer: none => geen cert-manager-annotatie op de Ingress, dus geen
      # Certificate-object en geen Let's Encrypt die het klantcert overschrijft.
      issuer: none
    branding:
      organisationName: gemeente Roosendaal
      themeClassname: roosendaal-theme
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/roosendaal/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/roosendaal/favicon.ico