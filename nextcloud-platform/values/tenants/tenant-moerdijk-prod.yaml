---
tenant:
  name: moerdijk-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
    versions:
      opencatalogi: "1.0.9"
      openconnector: "0.2.24"
      openregister: "1.1.5"
  frontend:
    tag: "v1.0.0"
    host: open.moerdijk.nl
    tls:
      secretName: open-moerdijk-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: "Gemeente Moerdijk"
      themeClassname: "moerdijk-theme"
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-assets/cb2a9c865cdf0c95828859b2bf6da4de679d84e9/municipalities/moerdijk/jumbotron.webp"
      faviconUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-assets/main/municipalities/moerdijk/favicon.ico"
