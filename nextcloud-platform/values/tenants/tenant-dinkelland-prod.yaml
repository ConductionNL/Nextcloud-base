---
tenant:
  name: dinkelland-prod
  environment: prod
  wave: "1"
  dbType: postgres
  secrets:
    managed: true
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    tag: "latest"
    host: open.dinkelland.nl
    tls:
      secretName: open-dinkelland-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: "Gemeente Dinkelland"
      themeClassname: "dinkelland-theme"
      jumbotronImageUrl: "https://raw.githubusercontent.com/ConductionNL/woo-website-dinkelland/main/jumbotron.jpg"
