---
tenant:
  name: oudeijsselstreek-accept
  # Use accept env values for both -accept and -test tenants
  environment: accept
  wave: "1"
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # Migratie legacy frontend (ns oudeijsselstreek) 2026-07-06 — waardes 1:1
  # uit de legacy deploy (tag dev; publiek domein bevat een streepje:
  # oude-ijsselstreek.nl, tenant-naam niet). LET OP cutover: legacy app heet
  # oudeijsselstreek-accept-react (geen adoptie door de appset).
  frontend:
    tag: "v1.0.0"
    registry: "ghcr.io"
    repository: "conductionnl/woo-website-v2"
    host: acceptatie-open.oude-ijsselstreek.nl
    tls:
      secretName: acceptatie-open-oude-ijsselstreek-nl-tls
      # Betaald certSIGN-cert (verloopt 14 feb 2027), handmatig gezaaid.
      # issuer: none => geen cert-manager-annotatie op de Ingress, dus geen
      # Certificate-object en geen Let's Encrypt die het klantcert overschrijft.
      issuer: none
    branding:
      organisationName: gemeente Oude IJsselstreek
      themeClassname: oude-ijsselstreek-theme
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/oude-ijsselstreek/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/oude-ijsselstreek/favicon.ico
      footerHideLogo: true
