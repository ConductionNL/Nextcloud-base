---
tenant:
  name: moerdijk-accept
  # Use accept env values for both -accept and -test tenants
  environment: accept
  wave: "1"
  dbType: postgres
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  # Migratie legacy frontend (ns moerdijk) 2026-07-06 — waardes 1:1 uit de
  # legacy deploy (tag dev = huidige legacy tag; bewust later bumpen).
  # Favicon is een inline data-URI en gaat live mee (ignore-diff).
  frontend:
    tag: dev
    host: acceptatie-open.moerdijk.nl
    tls:
      secretName: acceptatie-open-moerdijk-nl-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: Gemeente Moerdijk
      themeClassname: moerdijk-theme
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/moerdijk/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/moerdijk/favicon.ico