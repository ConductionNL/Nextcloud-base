tenant:
  name: gooisemeren-migrate-prod
  environment: prod
  wave: "1"
  dbType: postgres
  # Temporary parallel build to validate the postgres + 250Gi re-platform of the
  # live gooisemeren-prod (mariadb) tenant. Served on the migrate hostname so it
  # runs alongside the live prod. After sign-off this instance is torn down and
  # gooisemeren-prod itself is re-platformed to postgres — do NOT cut this name
  # over to a canonical host (it would derive gooisemeren-migrate-prod.commonground.nu).
  hostname: gooisemeren.migrate.commonground.nu
  features:
    appapi: false
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
 

# Match the live prod local-disk footprint (gooisemeren-prod is at 250Gi).
persistence:
  size: 250Gi
