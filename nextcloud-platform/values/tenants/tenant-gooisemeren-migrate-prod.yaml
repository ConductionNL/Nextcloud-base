tenant:
  name: gooisemeren-migrate-prod
  environment: prod
  wave: "1"
  dbType: postgres
  # This is the live production instance for Gooise Meren (postgres re-platform,
  # promoted from the migrate hostname on 2026-06-12; the old mariadb
  # gooisemeren-prod tenant was removed). The explicit hostname override is
  # REQUIRED: the ApplicationSet would otherwise derive
  # gooisemeren-migrate.commonground.nu from the tenant name. Do not rename the
  # tenant — that changes the namespace and abandons the data.
  hostname: gooisemeren.commonground.nu
  hostnameOverride: true
  features:
    appapi: false
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister
  frontend:
    # Backend tenant is gooisemeren-migrate-prod, so the react-tenants appset
    # would derive gooisemeren-migrate.openwoo.app. Pin the public frontend host
    # to the real one. Upstream auto-follows tenant.hostname above
    # (gooisemeren.commonground.nu), so the two never drift.
    host: gooisemeren.openwoo.app
    # De legacy frontend serveerde ook open.gooisemeren.nl (cutover 2026-07-06).
    # Eén multi-SAN LE-cert voor beide hosts, zoals legacy; het oude secret
    # wordt gepreseed als gooisemeren-frontend-tls zodat er geen TLS-gat valt.
    extraHosts:
      - open.gooisemeren.nl
    tls:
      secretName: gooisemeren-frontend-tls
      issuer: letsencrypt-prod
    branding:
      organisationName: "gemeente Gooise Meren"
      themeClassname: "gooise-meren-theme"
      jumbotronImageUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/gooise-meren/jumbotron.webp
      faviconUrl: https://raw.githubusercontent.com/ConductionNL/woo-website-assets/refs/heads/main/municipalities/gooise-meren/favicon.ico

# Gooise Meren is the only tenant with substantial local disk needs
# (platform default is 50Gi in common.yaml).
persistence:
  size: 250Gi
