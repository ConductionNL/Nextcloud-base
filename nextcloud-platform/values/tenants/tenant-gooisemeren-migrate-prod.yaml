tenant:
  name: gooisemeren-migrate-prod
  environment: prod
  wave: "1"
  dbType: postgres
  # This is the live production instance for Gooise Meren (postgres re-platform,
  # promoted from the migrate hostname on 2026-06-12; the old mariadb
  # gooisemeren-prod tenant was removed). The explicit hostname override is
  # REQUIRED: the ApplicationSet would otherwise derive
  # gooisemeren-migrate.commonground.nu from the tenant name. Do not rename the
  # tenant — that changes the namespace and abandons the data.
  hostname: gooisemeren.commonground.nu
  hostnameOverride: true
  features:
    appapi: false
  apps:
    enabled:
      - opencatalogi
      - openconnector
      - openregister

# Gooise Meren is the only tenant with substantial local disk needs
# (platform default is 50Gi in common.yaml).
persistence:
  size: 250Gi
