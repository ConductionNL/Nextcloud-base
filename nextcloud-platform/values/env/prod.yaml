---
# Environment-specific values for PRODUCTION environment
# Merged with common.yaml and tenant values

# RS=1 until ephemeral-code HA is implemented (RWO PVC blocks multi-node RS=2)
replicaCount: 1

# Production resources – no requests, only limits
resources:
  limits:
    cpu: 4
    memory: 6Gi

# HPA is managed via the tenant-hpa chart (AverageValue, no requests needed).
# The chart's native HPA (AverageUtilization) requires requests, so it stays off.
hpa:
  enabled: false

# Production logging - DON'T mount as ConfigMap, let Nextcloud handle it
# Configure logging via occ commands after install:
#   occ config:system:set loglevel --value=2
#   occ config:system:set log_type --value=file

# Production Let's Encrypt issuer
ingress:
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Additional production hardening
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

# S3 configuration for prod environment (Fuga Cloud)
s3:
  enabled: true
  endpoint: "https://core.fuga.cloud:8080"
  region: ""
  pathStyle: true
  sslVerify: true
  legacyAuth: false

# PgBouncer for prod
externalDatabase:
  host: pgbouncer.nextcloud-platform.svc.cluster.local
  port: 5432

# Priority class disabled - not available in this cluster
# priorityClassName: nextcloud-tenant-high

# Production-appropriate probe settings
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 6

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 3

startupProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 30

# Pod labels for prod
podLabels:
  environment: prod
  nextcloud.platform/tier: production

# Frequent cron in prod
cronjob:
  schedule: "*/5 * * * *"

nginx:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi

# Pin pods to dedicated Nextcloud nodes (worker.gardener.cloud/pool=nextcloud)
nodeSelector:
  worker.gardener.cloud/pool: nextcloud

# Pod anti-affinity for HA
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nextcloud
          topologyKey: kubernetes.io/hostname
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nextcloud
          topologyKey: topology.kubernetes.io/zone

# Topology spread for zone distribution
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: nextcloud

# PDB for prod
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# PHP memory limit for prod — higher than common.yaml (2048M) to match 6Gi container limit.
# Overrides only www.conf; other phpConfigs keys from common.yaml are unaffected (map merge).
nextcloud:
  phpConfigs:
    www.conf: |
      [www]
      user = www-data
      group = www-data
      listen = 127.0.0.1:9000

      pm = dynamic
      pm.max_children = 50
      pm.start_servers = 5
      pm.min_spare_servers = 5
      pm.max_spare_servers = 35
      pm.max_requests = 500

      ; PHP-FPM status endpoint (for monitoring)
      pm.status_path = /fpm-status
      pm.status_listen = 127.0.0.1:9001
      ping.path = /fpm-ping
      ping.response = pong

      ; PHP settings
      php_admin_value[memory_limit] = 4096M
      php_admin_value[upload_max_filesize] = 16G
      php_admin_value[post_max_size] = 16G
      php_admin_value[max_execution_time] = 3600
      php_admin_value[max_input_time] = 3600
      php_admin_value[output_buffering] = Off
