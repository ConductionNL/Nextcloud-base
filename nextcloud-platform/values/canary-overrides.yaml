---
# =============================================================================
# CANARY OVERRIDES — loaded only when tenant.canary: true
# =============================================================================
# This file is the staging area for features being validated on canary-prod
# before graduating to common.yaml or env/prod.yaml.
#
# Rules:
#   - Never put production-ready settings here
#   - Each entry must have a comment explaining what it is and when it graduates
#   - Loaded 4th in the values merge order (after db/, before tenants/)
#   - Gated by the ApplicationSet: only applied when .tenant.canary == true
#
# Graduation checklist:
#   [ ] Validated on canary-prod for at least one full week
#   [ ] No regressions in logs, metrics, or health checks
#   [ ] Move entry to common.yaml or env/prod.yaml
#   [ ] Remove entry from this file
# =============================================================================

# ---------------------------------------------------------------------------
# Phase 1 PoC: stateless pods — emptyDir per pod, no shared PVC
# Status: IN VALIDATION on canary-prod (since 2026-03-09)
# Reason: ext4 Cinder multi-attach causes inode corruption with RS>1.
#         emptyDir per pod eliminates shared state, unlocks RS=2.
# Note: sizeLimit (spec: 2Gi) requires chart-level emptyDir support —
#       not yet exposed by upstream nextcloud/nextcloud Helm chart.
#       Track as follow-up; no hard limit for PoC is acceptable.
# Graduate to: common.yaml when Phase 2 custom image is confirmed stable
# ---------------------------------------------------------------------------
persistence:
  enabled: false

nextcloud:
  # ---------------------------------------------------------------------------
  # Stateless identity: instanceid, passwordsalt, secret must survive pod
  # restarts — injected via ApplicationSet extraEnv (NEXTCLOUD_INSTANCEID etc.)
  # so they never regenerate on emptyDir restarts.
  # Captured from first successful install on 2026-03-09.
  # NOTE: extraEnv is intentionally NOT set here — Helm replaces arrays, so
  #       only the ApplicationSet's inline values: block is authoritative for
  #       nextcloud.extraEnv. Canary identity vars are gated there on
  #       tenant.canary == true.
  # Graduate to: per-tenant secret pattern in Phase 2 (create-tenant-secret.sh
  # should generate and store these at tenant creation time).
  # ---------------------------------------------------------------------------
  configs:
    # CAN_INSTALL — allows the Docker entrypoint to proceed when the config/
    # directory has content but no config.php (always the case with emptyDir).
    CAN_INSTALL: ""

    # -------------------------------------------------------------------------
    # Stateless identity (Phase B, 2026-06-08 postgres rebuild). instanceid/
    # passwordsalt/secret are injected from nextcloud-secrets so they survive
    # emptyDir pod restarts instead of regenerating. Values were captured from
    # the fresh postgres install and stored in the secret before this was
    # re-enabled. installed=>true makes the entrypoint skip reinstall; the
    # pre-installation hook (below) supplies the postgres connection on restart.
    # -------------------------------------------------------------------------
    identity.config.php: |
      <?php
      $CONFIG = array (
        'installed' => true,
        'instanceid' => getenv('NEXTCLOUD_INSTANCEID'),
        'passwordsalt' => getenv('NEXTCLOUD_PASSWORDSALT'),
        'secret' => getenv('NEXTCLOUD_SECRET'),
        'trusted_domains' => ['canary.commonground.nu'],
        'overwrite.cli.url' => 'https://canary.commonground.nu',
      );

    # ---------------------------------------------------------------------------
    # S3 primary objectstore — Fuga Cloud / Ceph RGW
    # Status: IN VALIDATION on canary-prod
    # Reason: eliminates local PVC dependency; required for stateless HA pods.
    # Prefix isolates each tenant's objects within the shared 'nextcloud' bucket.
    # autocreate: false — bucket already exists.
    # use_path_style: true — required for Ceph/Fuga (no virtual-hosted-style).
    # Credentials come from nextcloud-secrets via S3_ACCESS_KEY / S3_SECRET_KEY
    # env vars injected by the ApplicationSet.
    # MIGRATION NOTE: 26 existing root-level objects (no prefix) were written by
    # the manual occ-configured objectstore. Before applying this config, copy
    # those objects to the canary-prod/ prefix in S3, OR do a clean reinstall
    # (wipe MariaDB + remove 'installed' from identity.config.php). See runbook.
    # Graduate to: env/prod.yaml when validated; replace hardcoded endpoint/bucket
    # with env vars injected per-tenant from the ApplicationSet.
    # ---------------------------------------------------------------------------
    objectstore.config.php: |
      <?php
      $CONFIG = [
        'objectstore' => [
          'class'     => '\\OC\\Files\\ObjectStore\\S3',
          'arguments' => [
            'bucket'         => 'nextcloud',
            'prefix'         => getenv('NEXTCLOUD_OBJECTSTORE_PREFIX') ?: 'canary-prod/',
            'key'            => getenv('S3_ACCESS_KEY'),
            'secret'         => getenv('S3_SECRET_KEY'),
            'hostname'       => 'core.fuga.cloud',
            'port'           => 8080,
            'use_ssl'        => true,
            'use_path_style' => true,
            'autocreate'     => false,
            'region'         => 'us-east-1',
          ],
        ],
      ];


  # ---------------------------------------------------------------------------
  # Volume permissions fix — originally for Cinder RWX fsGroup issue.
  # With emptyDir, Kubernetes applies fsGroup correctly so this is a fast
  # no-op (stat check exits immediately). Kept because common.yaml still
  # ships it for prod tenants on cinder-rwx; removing here would cause a
  # merge conflict. Will clean up when Phase 2 graduates.
  # ---------------------------------------------------------------------------
  extraInitContainers:
    - name: volume-permissions
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          if [ "$(stat -c '%u' /var/www/html)" != "33" ]; then
            echo "Fixing /var/www/html ownership (owned by $(stat -c '%u:%g' /var/www/html), expected 33:33)"
            chown -R 33:33 /var/www/html
            echo "Done"
          else
            echo "/var/www/html already owned by www-data (33), skipping"
          fi
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: nextcloud-main
          mountPath: /var/www/html

  # ---------------------------------------------------------------------------
  # pre-installation hook — checks DB state on pod start and writes a bootstrap
  # config.php (postgres connection) when Nextcloud is already installed, so the
  # entrypoint skips reinstall. CRITICAL for stateless (emptyDir) restarts: the
  # emptyDir is wiped on every restart, so without this the entrypoint would see
  # an empty config dir and attempt a fresh install over the populated DB.
  # MUST live under nextcloud.hooks — the chart ignores a top-level `hooks:` key
  # (mounts nextcloud.hooks.* at /docker-entrypoint-hooks.d/<hook>/helm.sh).
  # Graduate to: custom Nextcloud image in Phase 2.
  # ---------------------------------------------------------------------------
  hooks:
    pre-installation: |
      #!/bin/bash
      set -euo pipefail
      LOG="/tmp/nc-pre-install.log"
      log() { echo "$(date -Iseconds) $*" | tee -a "$LOG"; }

      log "pre-installation: checking DB state..."

      DB_HOST="${POSTGRES_HOST:-nextcloud-postgresql}"
      DB_NAME="${POSTGRES_DB:-nextcloud}"
      DB_USER="${POSTGRES_USER:-nextcloud}"
      DB_PASS="${POSTGRES_PASSWORD:-}"

      HAS_TABLES=$(php -r "
        try {
          \$pdo = new PDO(
            'pgsql:host=${DB_HOST};port=5432;dbname=${DB_NAME}',
            '${DB_USER}', '${DB_PASS}',
            [PDO::ATTR_TIMEOUT => 3]
          );
          \$r = \$pdo->query(\"SELECT to_regclass('public.oc_users')\");
          \$row = \$r ? \$r->fetchColumn() : null;
          echo \$row ? 'yes' : 'no';
        } catch(Exception \$e) {
          echo 'no';
        }
      " 2>/dev/null || echo 'no')

      if [ "\$HAS_TABLES" = "yes" ]; then
        log "DB already installed — writing bootstrap config.php to skip reinstall"
        mkdir -p /var/www/html/config
        cat > /var/www/html/config/config.php << PHPEOF
      <?php
      \$CONFIG = array (
        'installed'     => true,
        'datadirectory' => '/var/www/html/data',
        'dbtype'        => 'pgsql',
        'dbtableprefix' => 'oc_',
        'dbhost'        => '${DB_HOST}',
        'dbport'        => '5432',
        'dbname'        => '${DB_NAME}',
        'dbuser'        => '${DB_USER}',
        'dbpassword'    => '${DB_PASS}',
        'version'       => '32.0.5.0',
      );
      PHPEOF
        log "config.php written — occ maintenance:install will skip"
      else
        log "DB is empty or unreachable — proceeding with fresh install"
      fi

# ---------------------------------------------------------------------------
# image.pullPolicy: Always -> IfNotPresent
# Status: IN VALIDATION op de canary-tenants (sinds 2026-08-05)
# Reason: image.tag is gepind (common.yaml), dus Always levert bij elke pod-start
#         een registry-round-trip op zonder dat er iets nieuws te halen valt. Dat
#         kost pull-tijd en maakt elke herstart afhankelijk van de beschikbaarheid
#         van de registry — precies het verkeerde moment om dat te zijn.
# Risk:   bij een mutable tag zou IfNotPresent een verouderd image vastzetten.
#         Niet van toepassing zolang image.tag een concrete versie is; gaat de tag
#         ooit floaten, dan moet dit terug naar Always.
# Note:   pullPolicy zit in het pod-template, dus in common.yaml zou dit alle 76
#         tenant-deployments in één keer omrollen. Vandaar eerst hier.
# Graduate to: common.yaml na een volle week zonder pull-fouten op canary
# ---------------------------------------------------------------------------
image:
  pullPolicy: IfNotPresent
