---
# App-of-apps "root" Application for the Nextcloud platform.
#
# Purpose: make the contents of nextcloud-platform/argo/ (AppProjects,
# ApplicationSets, and the bundled platform Application) GitOps-managed instead
# of hand-applied. Once this root app is synced, repo == cluster for those
# objects: commit to Codeberg main -> Argo reconciles. No more live kubectl
# patch/apply to keep projects/appsets in sync.
#
# This manifest lives OUTSIDE the synced path (nextcloud-platform/bootstrap/,
# not nextcloud-platform/argo/) so the root app does not manage itself. It is
# applied ONCE, by hand, to bootstrap the chain:
#   kubectl apply -f nextcloud-platform/bootstrap/nextcloud-platform-bootstrap.yaml
#
# As of 2026-06-23 the tenant ApplicationSet (applicationsets/nextcloud-tenants.yaml)
# IS managed here too. Its canary override no longer uses a raw {{- if }} control
# line inside valueFiles (which was invalid standalone YAML and blocked the
# directory source); it now uses a templated filename + helm.ignoreMissingValueFiles,
# so the manifest is valid YAML and applies cleanly via this directory-type source.
# Result: no more hand-applying the tenant AppSet — commit to Codeberg main and this
# root app reconciles it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud-platform-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nextcloud-platform
    nextcloud.platform/component: bootstrap
  # No resources-finalizer on purpose — deleting this root app ORPHANs the
  # managed projects/appsets rather than cascade-deleting them.
  finalizers: []
spec:
  project: default
  source:
    repoURL: "https://codeberg.org/conduction/Nextcloud-base.git"
    targetRevision: HEAD
    path: nextcloud-platform/argo
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Manual sync to start (mirrors the react-platform bootstrap): review the diff
  # in the UI and sync by hand. Switch to automated:{selfHeal,prune} later once
  # the chain is trusted.
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
